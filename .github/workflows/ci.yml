name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            src:
              - 'src/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
              - 'biome.json'
              - 'Makefile'
              - '.github/workflows/**'
              # Stack configuration is part of the program's input: a change
              # here alters what `pulumi preview` would do. Without these,
              # a PR editing only stack config skips every job and still
              # reports `CI Success` green.
              - 'Pulumi.yaml'
              - 'Pulumi.*.yaml'

  lint:
    needs: changes
    if: needs.changes.outputs.src == 'true'
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run make lint-ts
        run: make lint-ts

  lint-skip:
    needs: changes
    if: needs.changes.outputs.src == 'false'
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - run: echo "No relevant changes, skipping lint"

  test:
    needs: changes
    if: needs.changes.outputs.src == 'true'
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run make test
        run: make test

  test-skip:
    needs: changes
    if: needs.changes.outputs.src == 'false'
    name: Test
    runs-on: ubuntu-latest
    steps:
      - run: echo "No relevant changes, skipping tests"

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [changes, lint, lint-skip, test, test-skip]
    if: always()
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          allowed-skips: lint, lint-skip, test, test-skip
          jobs: ${{ toJSON(needs) }}
