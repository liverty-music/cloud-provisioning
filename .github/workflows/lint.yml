name: Lint

on:
  push:
    branches:
      - main
    paths:
      - "k8s/**"
      - ".kube-linter.yaml"
      - "scripts/check-spot-nodeselector.sh"
      - "Makefile"
      - ".github/workflows/lint.yml"
  pull_request:
    paths:
      - "k8s/**"
      - ".kube-linter.yaml"
      - "scripts/check-spot-nodeselector.sh"
      - "Makefile"
      - ".github/workflows/lint.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Install Kustomize
        uses: imranismail/setup-kustomize@2ba527d4d055ab63514ba50a99456fc35684947f # v2

      - name: Install KubeLinter
        run: |
          curl -sLO "https://github.com/stackrox/kube-linter/releases/latest/download/kube-linter-linux.tar.gz"
          tar -xzf kube-linter-linux.tar.gz
          sudo install kube-linter /usr/local/bin/

      - name: Run make lint-k8s
        run: make lint-k8s
