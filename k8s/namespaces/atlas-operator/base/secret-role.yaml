# Namespaced Secret access for the operator, replacing the chart's cluster-wide
# grant (rbac.clusterWideSecretAccess: false). get reads atlas-db-credentials;
# create/update maintain the Secret holding the AtlasMigration directory state.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: atlas-operator-secrets
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - create
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: atlas-operator-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: atlas-operator-secrets
subjects:
- kind: ServiceAccount
  name: atlas-operator
  namespace: atlas-operator
