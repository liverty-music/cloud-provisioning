apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Purpose: Atlas Operator applies the backend schema migrations and the
# area and time zone reference data (the `backend-migration` and
# `backend-reference-data` AtlasMigrations synced by the `backend-migrations`
# Application) to Cloud SQL. It is the only migration path in prod.
#
# Atlas Operator is a singleton controller with no env-divergent state (no
# ESC secrets mounted, no hostnames, no per-env config). The dev overlay's
# spot-nodeSelector and right-sized resource requests are the right baseline
# for prod too — per design D2 / spec Requirement 3, resource sizing matches
# dev exactly until real prod load justifies a `right-size-prod` follow-up.

resources:
- ../../base

patches:
# No Spot nodeSelector in prod: the Deployments select no ComputeClass, so the
# cluster default class (k8s/cluster/overlays/prod/compute-class-default.yaml)
# places them on Spot with on-demand fallback and migrates them back
# (optimize-prod-gke-cost D1).

# Match dev's resource requests/limits exactly (design D2).
- target:
    kind: Deployment
    name: atlas-operator
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: atlas-operator
    spec:
      template:
        spec:
          containers:
          - name: manager
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
                ephemeral-storage: 100Mi
              # The manager runs the atlas CLI in its own container. Applying
              # the area reference data (about 700 KB of SQL) while the schema
              # migrations reconcile held it at 98m of 100m CPU and 126Mi of
              # 128Mi, so its liveness probe timed out and it restarted before
              # either AtlasMigration finished (2026-11-25).
              limits:
                cpu: 500m
                memory: 512Mi
                ephemeral-storage: 100Mi
