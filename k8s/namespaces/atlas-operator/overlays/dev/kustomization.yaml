apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base

patches:
- target:
    kind: Deployment
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: atlas-operator
    spec:
      template:
        spec:
          nodeSelector:
            cloud.google.com/gke-spot: "true"

# Right-size CPU request for dev
- target:
    kind: Deployment
    name: atlas-operator
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: atlas-operator
    spec:
      template:
        spec:
          containers:
          - name: manager
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
                ephemeral-storage: 100Mi
              # The manager runs the atlas CLI in its own container. Applying
              # the area reference data (about 700 KB of SQL) while the schema
              # migrations reconcile held it at 98m of 100m CPU and 126Mi of
              # 128Mi, so its liveness probe timed out and it restarted before
              # either AtlasMigration finished (2026-11-25).
              limits:
                cpu: 500m
                memory: 512Mi
                ephemeral-storage: 100Mi
