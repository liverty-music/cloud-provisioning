apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nats

# Declarative JetStream resources (Stream/Consumer CRs) reconciled by NACK.
# ArgoCD adopts the already-live durables in place (they were applied during the
# declarative-jetstream-nack prod cut-over); with preventDelete on every CR,
# removing one orphans (never deletes) the underlying stream/durable.
resources:
- jetstream

helmCharts:
- name: nats
  repo: https://nats-io.github.io/k8s/helm/charts/
  version: 1.3.16
  releaseName: nats
  namespace: nats
  valuesFile: values.yaml
# NACK — declarative JetStream controller. Reconciles Stream/Consumer CRDs
# against the in-cluster NATS JSM API and is the exclusive owner of JetStream
# streams/consumers (declarative-jetstream-nack). control-loop mode uses the
# controller-runtime backend for more reliable state enforcement.
- name: nack
  repo: https://nats-io.github.io/k8s/helm/charts/
  version: 0.35.0
  releaseName: nack
  namespace: nats
  valuesFile: nack-values.yaml
