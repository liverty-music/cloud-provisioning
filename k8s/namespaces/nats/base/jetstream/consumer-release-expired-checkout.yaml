apiVersion: jetstream.nats.io/v1beta2
kind: Consumer
metadata:
  name: release-expired-checkout
spec:
  streamName: CHECKOUT
  durableName: release-expired-checkout
  # PULL work-queue, like the other event-consumer durables. Starts the
  # release workflow of the card authorization of an Expired Checkout's Order
  # (OpenSpec change unify-order-issuance).
  deliverPolicy: new
  filterSubject: CHECKOUT.expired
  ackPolicy: explicit
  ackWait: 30s
  maxAckPending: 1000
  maxDeliver: -1
  replayPolicy: instant
  preventDelete: true
