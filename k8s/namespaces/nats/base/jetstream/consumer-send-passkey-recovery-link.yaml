apiVersion: jetstream.nats.io/v1beta2
kind: Consumer
metadata:
  name: send-passkey-recovery-link
spec:
  streamName: USER
  durableName: send-passkey-recovery-link
  # PULL work-queue (no deliverSubject/deliverGroup) — declarative, replaces the
  # push consumer whose random _INBOX deliver subject cannot be declared (D5).
  deliverPolicy: new
  filterSubject: USER.passkey_recovery_requested
  ackPolicy: explicit
  ackWait: 30s
  maxAckPending: 1000
  maxDeliver: -1
  replayPolicy: instant
  preventDelete: true
