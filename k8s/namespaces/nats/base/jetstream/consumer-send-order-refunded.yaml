apiVersion: jetstream.nats.io/v1beta2
kind: Consumer
metadata:
  name: send-order-refunded
spec:
  streamName: ORDER
  durableName: send-order-refunded
  # PULL work-queue, like the other event-consumer durables. Tells the fan of
  # an Order refunded for a cancellation (OpenSpec change
  # notify-fans-of-cancellation-and-refund, design D6).
  deliverPolicy: new
  filterSubject: ORDER.refunded
  ackPolicy: explicit
  ackWait: 30s
  maxAckPending: 1000
  maxDeliver: -1
  replayPolicy: instant
  preventDelete: true
