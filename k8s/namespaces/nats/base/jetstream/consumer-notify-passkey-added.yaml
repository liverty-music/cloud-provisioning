apiVersion: jetstream.nats.io/v1beta2
kind: Consumer
metadata:
  name: notify-passkey-added
spec:
  streamName: USER
  durableName: notify-passkey-added
  # PULL work-queue. The backend event consumer starts the passkey change
  # email of each Passkey that Passkey.Create announces (OpenSpec change
  # publish-events-through-outbox); the workflow worker sends it.
  deliverPolicy: new
  filterSubject: USER.passkey_added
  ackPolicy: explicit
  ackWait: 30s
  maxAckPending: 1000
  maxDeliver: -1
  replayPolicy: instant
  preventDelete: true
