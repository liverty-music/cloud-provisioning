apiVersion: jetstream.nats.io/v1beta2
kind: Consumer
metadata:
  name: send-resale-sold
spec:
  streamName: RESALE_LISTING
  durableName: send-resale-sold
  # PULL work-queue (no deliverSubject/deliverGroup), like the other event-consumer durables.
  deliverPolicy: new
  filterSubject: RESALE_LISTING.refunded
  ackPolicy: explicit
  ackWait: 30s
  maxAckPending: 1000
  maxDeliver: -1
  replayPolicy: instant
  preventDelete: true
