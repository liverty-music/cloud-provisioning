apiVersion: jetstream.nats.io/v1beta2
kind: Consumer
metadata:
  name: track-lottery-entry-result
spec:
  streamName: LOTTERY_ENTRY
  durableName: track-lottery-entry-result
  # PULL work-queue (no deliverSubject/deliverGroup) — declarative, replaces the
  # push consumer whose random _INBOX deliver subject cannot be declared (D5).
  deliverPolicy: new
  filterSubjects: [LOTTERY_ENTRY.won, LOTTERY_ENTRY.lost]
  ackPolicy: explicit
  ackWait: 30s
  maxAckPending: 1000
  maxDeliver: -1
  replayPolicy: instant
  preventDelete: true
