apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nats
# Do not set `replicas: 0` on a Consumer (it means "inherit from the stream",
# which omitting it also means). NACK writes each CR back with a full Update
# whose Go struct tags the field omitempty, so a 0 is stripped on every
# reconcile and ArgoCD reports the Consumer OutOfSync forever.
#
# Every Consumer sets preventDelete, so removing one here leaves its durable on
# the server: delete it by hand as docs/runbooks/retire-jetstream-durable.md says.
resources:
- stream-concert.yaml
- stream-venue.yaml
- stream-artist.yaml
- stream-user.yaml
- stream-notification.yaml
- stream-sales-phase.yaml
- stream-ticket-journey.yaml
- stream-ticket-email.yaml
- stream-organizer.yaml
- stream-series-image.yaml
- stream-order.yaml
- stream-event.yaml
- stream-follow.yaml
- stream-passkey.yaml
- stream-push-subscription.yaml
- stream-ticket-sale.yaml
- stream-lottery-entry.yaml
- stream-resale-entry.yaml
- stream-resale-listing.yaml
- stream-checkout.yaml
- stream-ticket.yaml
- stream-poison.yaml
