apiVersion: jetstream.nats.io/v1beta2
kind: Consumer
metadata:
  name: track-follow-hype-changed
spec:
  streamName: FOLLOW
  durableName: track-follow-hype-changed
  # PULL work-queue (no deliverSubject/deliverGroup) — declarative, replaces the
  # push consumer whose random _INBOX deliver subject cannot be declared (D5).
  deliverPolicy: new
  filterSubject: FOLLOW.hype_changed
  ackPolicy: explicit
  ackWait: 30s
  maxAckPending: 1000
  maxDeliver: -1
  replayPolicy: instant
  preventDelete: true
