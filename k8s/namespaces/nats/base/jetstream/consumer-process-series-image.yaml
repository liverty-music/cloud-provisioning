apiVersion: jetstream.nats.io/v1beta2
kind: Consumer
metadata:
  name: process-series-image
spec:
  streamName: SERIES_IMAGE
  durableName: process-series-image
  # Successor of the former media_uploaded durable; same settings. PULL work-queue
  # (no deliverSubject/deliverGroup) — declarative NACK consumer drained by the
  # series-image-consumer Deployment (KEDA scale-to-zero). Server-side, so the
  # durable survives while the consumer is scaled to 0.
  deliverPolicy: all
  filterSubject: SERIES_IMAGE.uploaded
  ackPolicy: explicit
  ackWait: 120s
  maxAckPending: 10
  maxDeliver: 3
  replayPolicy: instant
  preventDelete: true
