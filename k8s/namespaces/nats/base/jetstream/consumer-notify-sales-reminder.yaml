apiVersion: jetstream.nats.io/v1beta2
kind: Consumer
metadata:
  name: notify-sales-reminder
spec:
  streamName: SALES_PHASE
  durableName: notify-sales-reminder
  # PULL work-queue (no deliverSubject/deliverGroup) — declarative, replaces the
  # push consumer whose random _INBOX deliver subject cannot be declared (D5).
  deliverPolicy: new
  filterSubject: SALES_PHASE.reminder_due
  ackPolicy: explicit
  ackWait: 30s
  maxAckPending: 1000
  maxDeliver: -1
  replayPolicy: instant
  replicas: 0
  preventDelete: true
