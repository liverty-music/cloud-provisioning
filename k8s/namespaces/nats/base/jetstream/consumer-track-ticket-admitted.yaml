apiVersion: jetstream.nats.io/v1beta2
kind: Consumer
metadata:
  name: track-ticket-admitted
spec:
  streamName: TICKET
  durableName: track-ticket-admitted
  # PULL work-queue (no deliverSubject/deliverGroup) — declarative, replaces the
  # push consumer whose random _INBOX deliver subject cannot be declared (D5).
  deliverPolicy: new
  filterSubject: TICKET.admitted
  ackPolicy: explicit
  ackWait: 30s
  maxAckPending: 1000
  maxDeliver: -1
  replayPolicy: instant
  preventDelete: true
