apiVersion: jetstream.nats.io/v1beta2
kind: Consumer
metadata:
  name: mark-ticket-journey-applied
spec:
  streamName: ORDER
  durableName: mark-ticket-journey-applied
  # PULL work-queue (no deliverSubject/deliverGroup), like the other event-consumer durables.
  deliverPolicy: new
  filterSubject: ORDER.lottery_entry_entered
  ackPolicy: explicit
  ackWait: 30s
  maxAckPending: 1000
  maxDeliver: -1
  replayPolicy: instant
  preventDelete: true
