apiVersion: jetstream.nats.io/v1beta2
kind: Consumer
metadata:
  name: track-checkout-expired
spec:
  streamName: ORDER
  durableName: track-checkout-expired
  # PULL work-queue (no deliverSubject/deliverGroup) — declarative, replaces the
  # push consumer whose random _INBOX deliver subject cannot be declared (D5).
  deliverPolicy: new
  filterSubject: ORDER.checkout_expired
  ackPolicy: explicit
  ackWait: 30s
  maxAckPending: 1000
  maxDeliver: -1
  replayPolicy: instant
  preventDelete: true
