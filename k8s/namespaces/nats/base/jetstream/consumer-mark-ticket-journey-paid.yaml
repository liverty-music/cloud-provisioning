apiVersion: jetstream.nats.io/v1beta2
kind: Consumer
metadata:
  name: mark-ticket-journey-paid
spec:
  streamName: ORDER
  durableName: mark-ticket-journey-paid
  # PULL work-queue (no deliverSubject/deliverGroup), like deliver-notification.
  deliverPolicy: new
  filterSubject: ORDER.paid
  ackPolicy: explicit
  ackWait: 30s
  maxAckPending: 1000
  maxDeliver: -1
  replayPolicy: instant
  preventDelete: true
