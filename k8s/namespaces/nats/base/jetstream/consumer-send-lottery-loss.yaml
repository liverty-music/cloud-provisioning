apiVersion: jetstream.nats.io/v1beta2
kind: Consumer
metadata:
  name: send-lottery-loss
spec:
  streamName: LOTTERY_ENTRY
  durableName: send-lottery-loss
  # PULL work-queue, like the other event-consumer durables. Sends the loss
  # email and push of a Lost entry, on a cursor of its own so a mail outage
  # never delays the start of a release (OpenSpec change
  # make-lottery-draw-durable).
  deliverPolicy: new
  filterSubject: LOTTERY_ENTRY.lost
  ackPolicy: explicit
  ackWait: 30s
  maxAckPending: 1000
  maxDeliver: -1
  replayPolicy: instant
  preventDelete: true
