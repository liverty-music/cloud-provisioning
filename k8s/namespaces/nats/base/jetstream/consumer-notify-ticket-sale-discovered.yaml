apiVersion: jetstream.nats.io/v1beta2
kind: Consumer
metadata:
  name: notify-ticket-sale-discovered
spec:
  streamName: TICKET_SALE
  durableName: notify-ticket-sale-discovered
  # PULL work-queue (no deliverSubject/deliverGroup) — declarative, replaces the
  # push consumer whose random _INBOX deliver subject cannot be declared (D5).
  deliverPolicy: new
  filterSubject: TICKET_SALE.discovered
  ackPolicy: explicit
  ackWait: 30s
  maxAckPending: 1000
  maxDeliver: -1
  replayPolicy: instant
  preventDelete: true
