apiVersion: v1
kind: ServiceAccount
metadata:
  name: media-consumer
  annotations:
    # Dedicated media-consumer GSA (Workload Identity), created in kubernetes.ts.
    # It holds bucket-scoped storage.objectAdmin on both organizer-media buckets
    # (organizer-media.ts); no Cloud SQL access.
    iam.gke.io/gcp-service-account: media-consumer@liverty-music-prod.iam.gserviceaccount.com
