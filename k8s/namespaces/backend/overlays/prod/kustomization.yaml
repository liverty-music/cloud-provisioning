apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Prod backend overlay. Env-divergent fields per design D2 / spec Requirement 3:
#   - GSA: backend-app@liverty-music-prod (vs liverty-music-dev)
#   - Cloud SQL: liverty-music-prod:asia-northeast2:postgres-osaka
#     (sql-proxy/deployment.yaml + ConfigMap DATABASE_HOST / DATABASE_INSTANCE_CONNECTION_NAME)
#   - PSC DNS: 298474959c18.25pf3r4b6sfkn.asia-northeast2.sql.goog
#   - DATABASE_USER: backend-app@liverty-music-prod.iam
#   - CORS_ALLOWED_ORIGINS: https://liverty-music.app (apex)
#   - OIDC_ISSUER_URL: https://auth.liverty-music.app
#   - HTTPRoute hostname: api.liverty-music.app
#   - GCP_PROJECT_ID, ENVIRONMENT=production
#
# Replicas: 1 (per design D8). Resource sizing matches dev exactly.
#
# Resolved 2026-05-15:
#   - VAPID_PUBLIC_KEY → prod-specific value derived from the GSM
#     `vapid-private-key` private scalar (see server/configmap.env note).
# The concert-discovery CronJob runs on the base daily schedule (no
# Fridays-only patch), because prod's concert ingestion should be regular.
resources:
  - ../../base
  - sql-proxy/deployment.yaml
  # NOTE: the `backend-server` PodMonitoring was deleted (unify-workload-naming).
  # It was mis-specified from the prod bootstrap (2026-05-14): selector
  # `app: server-app` never matched any pod (the server workload carried
  # `app: server`), and its `port: metrics` endpoint referenced a container port
  # that neither `server` nor `fan-api` ever exposed — so it ingested zero series
  # and fed no AlertPolicy (all prod alerts are log-based or NATS-exporter-based).
  # Backend observability is the OTLP push model (OpenTelemetry SDK -> in-cluster
  # collector -> Cloud Monitoring), mirroring the same removal made for Zitadel.
namespace: backend
# Apply the Kubernetes Recommended Label `app.kubernetes.io/version` to every
# rendered resource (Deployment, CronJob, Service, etc.). Value SHALL be the
# bare semver without the leading `v` (per Kubernetes Recommended Labels
# convention: `1.0.0`, not `v1.0.0`). Bump this in lock-step with the `images:`
# block `newTag:` below — they SHALL refer to the same release.
#
# - `includeSelectors: false` keeps the label out of `selector.matchLabels`
#   and Service selectors; modifying selectors mid-rollout would orphan running
#   Pods. The label is metadata-only.
# - `includeTemplates: true` propagates the label to `spec.template.metadata.labels`
#   on Deployments / CronJobs so Pods carry it for Prometheus / OTel scraping.
labels:
  - pairs:
      app.kubernetes.io/version: "1.50.0"
    includeSelectors: false
    includeTemplates: true
patches:
  - path: serviceaccount_patch.yaml
    target:
      kind: ServiceAccount
      name: backend-app
  # Bind KSA admin-console-api to its dedicated prod GSA (Workload Identity).
  - path: serviceaccount_admin_console_api_patch.yaml
    target:
      kind: ServiceAccount
      name: admin-console-api
  # Bind KSA fan-api to its dedicated prod GSA (unify-workload-naming create-new).
  - path: serviceaccount_fan_api_patch.yaml
    target:
      kind: ServiceAccount
      name: fan-api
  # Bind KSA organizer-console-api to the admin-console-api prod GSA (reused;
  # no dedicated organizer GSA in this change).
  - path: serviceaccount_organizer_console_api_patch.yaml
    target:
      kind: ServiceAccount
      name: organizer-console-api
  # Bind KSA media-consumer to its dedicated prod GSA (Workload Identity).
  - path: serviceaccount_media_consumer_patch.yaml
    target:
      kind: ServiceAccount
      name: media-consumer
  # Global Spot VM patch for all Deployments
  - path: spot-vm_patch.yaml
    target:
      kind: Deployment
  - path: spot-vm_patch_cronjob.yaml
    target:
      kind: CronJob
  # fan-api — single replica + dev-parity sizing (unify-workload-naming).
  # Replaces the deleted server-app as the fan-facing backend (design D8/D2).
  - target:
      kind: Deployment
      name: fan-api
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: fan-api
      spec:
        replicas: 1
  - target:
      kind: Deployment
      name: fan-api
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: fan-api
      spec:
        template:
          spec:
            containers:
            - name: fan-api
              resources:
                requests:
                  cpu: 10m
                  memory: 60Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
  # admin-console-api — single replica (per design D8, matches server-app).
  - target:
      kind: Deployment
      name: admin-console-api
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: admin-console-api
      spec:
        replicas: 1
  # Env-specific ORGANIZER_CONSOLE_PROJECT_ID for admin-console-api ONLY (scoped
  # to this Deployment's container env so it never leaks into server-app). Value
  # is the Pulumi stack output `organizerConsoleProjectId` — the id of the shared
  # organizer-console Zitadel project provisioned by `organizer-tenancy` (stable;
  # this change only reads it).
  - target:
      kind: Deployment
      name: admin-console-api
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: admin-console-api
      spec:
        template:
          spec:
            containers:
            - name: server
              env:
              - name: ORGANIZER_CONSOLE_PROJECT_ID
                value: "386069101153353860"
              # Authenticate to Cloud SQL as admin-console-api's OWN IAM DB
              # user (overrides the backend-app DATABASE_USER from server-config
              # via envFrom). Matching IAM SQL user provisioned in postgres.ts.
              - name: DATABASE_USER
                value: "admin-console-api@liverty-music-prod.iam"
  # organizer-console-api — single replica (matches admin-console-api sizing).
  - target:
      kind: Deployment
      name: organizer-console-api
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: organizer-console-api
      spec:
        replicas: 1
  # Env-specific ORGANIZER_CONSOLE_PROJECT_ID + own IAM DB user for
  # organizer-console-api (scoped to this Deployment's container env). The
  # project id is the shared organizer-console Zitadel project (same value
  # admin-console-api uses; required in the token `aud`). DATABASE_USER points at
  # the dedicated organizer-console-api IAM SQL user provisioned in postgres.ts.
  - target:
      kind: Deployment
      name: organizer-console-api
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: organizer-console-api
      spec:
        template:
          spec:
            containers:
            - name: server
              env:
              - name: ORGANIZER_CONSOLE_PROJECT_ID
                value: "386069101153353860"
              - name: DATABASE_USER
                value: "organizer-console-api@liverty-music-prod.iam"
  # Prod fan API HTTPRoute hostname (fan-api-route replaces server-route).
  - target:
      kind: HTTPRoute
      name: fan-api-route
    patch: |-
      - op: add
        path: /spec/hostnames
        value: ["api.liverty-music.app"]
  # Prod admin API HTTPRoute hostname (admin-console-api-route, was server-admin-route).
  - target:
      kind: HTTPRoute
      name: admin-console-api-route
    patch: |-
      - op: add
        path: /spec/hostnames
        value: ["api.admin.liverty-music.app"]
  # Prod organizer API HTTPRoute hostname (organizer-console-api-route).
  - target:
      kind: HTTPRoute
      name: organizer-console-api-route
    patch: |-
      - op: add
        path: /spec/hostnames
        value: ["api.organizer.liverty-music.app"]
  # Match dev's event-consumer resource sizing.
  - target:
      kind: Deployment
      name: event-consumer
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: event-consumer
      spec:
        template:
          spec:
            containers:
            - name: consumer
              resources:
                requests:
                  cpu: 10m
                  memory: 20Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
  # event-consumer ScaledObject — pin to exactly 1 replica (min=max=1).
  #
  # minReplicaCount MUST be 1 (not 0): the Watermill JetStream push
  # consumers (durables) are deleted when the event-consumer Deployment scales to
  # zero and no subscriber holds the queue-group interest. A deleted durable
  # has no metric for KEDA's nats-jetstream scaler to read, so KEDA can never
  # scale the consumer back up from 0 — events published while idle (e.g. the
  # daily sales-phase discovery cron) pile up undelivered forever. Keeping one
  # replica always running holds the durables open so every event is consumed.
  # Long-lived streams created during earlier always-on periods (CONCERT,
  # ARTIST, USER) survived by chance; SALES_PHASE, added later, exposed the
  # deadlock. KEDA still scales up to maxReplicas under load.
  - target:
      kind: ScaledObject
      name: event-consumer
    patch: |-
      apiVersion: keda.sh/v1alpha1
      kind: ScaledObject
      metadata:
        name: event-consumer
      spec:
        minReplicaCount: 1
        maxReplicaCount: 1
  # media-consumer Deployment — match dev's resource sizing (libvips needs real
  # memory; too-small a limit OOM-kills the transcode).
  - target:
      kind: Deployment
      name: media-consumer
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: media-consumer
      spec:
        template:
          spec:
            containers:
            - name: media-consumer
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
  # media-consumer ScaledObject — cap concurrency at 1 replica in prod (serialize
  # transcodes to keep node-pool memory pressure bounded at launch volume).
  #
  # NOTE (deviation from the event-consumer "min=max=1" pin): minReplicaCount
  # stays at its base 0 (scale-to-zero). Unlike the event-consumer ScaledObject —
  # whose min MUST be 1 to hold its PUSH JetStream durables open — the
  # media-consumer's `media_uploaded` durable is a server-side PULL work-queue
  # Consumer (declarative NACK) that is NOT torn down when no pod is bound, so its
  # backlog metric stays readable at 0 replicas and KEDA can always scale back up.
  # Pinning min=1 here would keep an idle pod resident forever, defeating the
  # scale-to-zero design. Only maxReplicaCount is pinned.
  - target:
      kind: ScaledObject
      name: media-consumer
    patch: |-
      apiVersion: keda.sh/v1alpha1
      kind: ScaledObject
      metadata:
        name: media-consumer
      spec:
        maxReplicaCount: 1
configMapGenerator:
  # fan-api-config: prod env for the fan-facing backend; DATABASE_USER points at
  # the fan-api IAM DB user (unify-workload-naming). Replaces server-config.
  - name: fan-api-config
    behavior: merge
    envs:
      - fan-api/configmap.env
  - name: concert-discovery-job-config
    behavior: merge
    envs:
      - cronjob/concert-discovery/configmap.env
  - name: artist-image-sync-job-config
    behavior: merge
    envs:
      - cronjob/artist-image-sync/configmap.env
  - name: sales-phase-discovery-job-config
    behavior: merge
    envs:
      - cronjob/sales-phase-discovery/configmap.env
  - name: sales-reminders-job-config
    behavior: merge
    envs:
      - cronjob/sales-reminders/configmap.env
  - name: event-consumer-config
    behavior: merge
    envs:
      - event-consumer/configmap.env
  - name: media-consumer-config
    behavior: merge
    envs:
      - media-consumer/configmap.env
# Pin all backend images to the prod Artifact Registry with an
# immutable semantic-version tag. Per OpenSpec `enable-prod-ar-immutable-tags`
# + the `prod-image-tag-immutability` spec, prod uses semver tags (e.g.,
# v1.0.0) backed by AR's `dockerConfig.immutableTags: true` policy, which
# rejects tag-overwrite attempts at the registry API. Combined, this gives
# at-a-glance version visibility AND digest-equivalent immutability. The
# inline comment after each `newTag:` records the source commit SHA so
# incident-response trace from manifest → exact commit does not require
# an Artifact Registry round-trip.
#
# Policy: see docs/runbooks/prod-image-tag-pinning.md
#
# Note on the `name:` field: each backend sub-base (`base/server/`,
# `base/consumer/`, `base/cronjob/*/`) already has its own `images:`
# transformer that rewrites the bare container `image: server` →
# `asia-northeast2-docker.pkg.dev/liverty-music-dev/backend/server:latest`
# (env-specific config in base is pre-existing tech debt; out of scope
# here). By the time this overlay's `images:` block runs, the rendered
# image is already the dev-AR form, so we match against THAT name.
# Kustomize's last-write-wins semantics then rewrites to the prod AR FQDN
# + semver tag.
#
# Dev overlay omits an `images:` block: ArgoCD Image Updater resolves the
# dev-AR `:latest` reference dynamically. Prod uses explicit semver
# pinning; dev AR repos stay mutable so Image Updater can rewrite tags.
#
# Bumping on release: this block is now CI-written, not hand-edited.
# Cutting a GH Release (e.g., v1.0.1) on backend retags the dev-AR digest
# into prod AR, then emits a `repository_dispatch` to this repo's
# `.github/workflows/bump-prod-pin.yml`, which rewrites every `newTag:`
# + their inline `# commit <sha>` trailers AND the `app.kubernetes.io/version`
# label above (in lock-step) and pushes straight to main. ArgoCD auto-syncs.
# No manual pin-bump PR. See docs/runbooks/prod-image-tag-pinning.md
# (OpenSpec change automate-prod-pin-bump).
images:
  # backend/api: the shared Connect-RPC API image (unify-workload-naming),
  # audience-neutral successor to `server`/`fan-api`. Now ACTIVE — both the
  # fan-api and admin-console-api workloads render `image: <base>` rewritten to
  # backend/api, so this single pin drives both (no version drift). Bumped by the
  # `component:backend` pin-bump (bump-prod-pin.yml IMAGES list).
  - name: asia-northeast2-docker.pkg.dev/liverty-music-dev/backend/api
    newName: asia-northeast2-docker.pkg.dev/liverty-music-prod/backend/api
    newTag: v1.50.0 # commit 0c43e270334ec8048c24c3c2f14d1bccef841950
  # server + fan-api pins removed (unify-workload-naming): fan-api + admin-console-api
  # now pull backend/api, so nothing renders backend/server or backend/fan-api.
  - name: asia-northeast2-docker.pkg.dev/liverty-music-dev/backend/consumer
    newName: asia-northeast2-docker.pkg.dev/liverty-music-prod/backend/consumer
    newTag: v1.50.0 # commit 0c43e270334ec8048c24c3c2f14d1bccef841950
  - name: asia-northeast2-docker.pkg.dev/liverty-music-dev/backend/concert-discovery
    newName: asia-northeast2-docker.pkg.dev/liverty-music-prod/backend/concert-discovery
    newTag: v1.50.0 # commit 0c43e270334ec8048c24c3c2f14d1bccef841950
  - name: asia-northeast2-docker.pkg.dev/liverty-music-dev/backend/artist-image-sync
    newName: asia-northeast2-docker.pkg.dev/liverty-music-prod/backend/artist-image-sync
    newTag: v1.50.0 # commit 0c43e270334ec8048c24c3c2f14d1bccef841950
  - name: asia-northeast2-docker.pkg.dev/liverty-music-dev/backend/sales-phase-discovery
    newName: asia-northeast2-docker.pkg.dev/liverty-music-prod/backend/sales-phase-discovery
    newTag: v1.50.0 # commit 0c43e270334ec8048c24c3c2f14d1bccef841950
  - name: asia-northeast2-docker.pkg.dev/liverty-music-dev/backend/sales-reminders
    newName: asia-northeast2-docker.pkg.dev/liverty-music-prod/backend/sales-reminders
    newTag: v1.50.0 # commit 0c43e270334ec8048c24c3c2f14d1bccef841950
  # media-consumer: shipped from the shared backend AR repo (backend/media-consumer).
  # Pinned to the prod AR + semver tag; the bump-prod-pin workflow keeps this in
  # lock-step. NOTE: the media-consumer image does not exist yet at this tag — it
  # is built once the backend Dockerfile target ships; the ScaledObject scales
  # from 0 and pulls no image until MEDIA.uploaded events arrive.
  - name: asia-northeast2-docker.pkg.dev/liverty-music-dev/backend/media-consumer
    newName: asia-northeast2-docker.pkg.dev/liverty-music-prod/backend/media-consumer
    newTag: v1.50.0 # commit 0c43e270334ec8048c24c3c2f14d1bccef841950
