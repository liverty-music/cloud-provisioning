# Stripe webhook signing secret for the settlement/payout flow
# (ticket-settlement-and-payout §5.1).
#
# WHY ITS OWN ExternalSecret: `fan-api-backend-secrets` is a single
# all-or-nothing bundle — ESO fails the whole thing, stranding every backend
# secret, if any referenced remote key is absent. Isolating this one means a
# fault here (a rotation gone wrong, a revoked key) can only fail THIS
# ExternalSecret. Paired with `optional: true` on the Deployment's envFrom, the
# pod still starts and the webhook handler fails closed (503) rather than the
# backend losing every secret it has.
#
# WHY prod-ONLY (not in base/): the GSM secret `stripe-webhook-signing-secret`
# is created by the prod Pulumi stack, which registers the webhook endpoint and
# writes the `whsec_…` Stripe returns. Per the change's §0 environment decision
# `dev` has no Stripe environment at all, so the key does not exist there. In
# base/ this would render into dev too and sit permanently SecretSyncError'd,
# leaving the ArgoCD app Degraded for a secret dev is never meant to have.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: fan-api-stripe-webhook-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: google-secret-manager
    kind: ClusterSecretStore
  target:
    name: fan-api-stripe-webhook-secret
    creationPolicy: Owner
  data:
    - secretKey: STRIPE_WEBHOOK_SIGNING_SECRET
      remoteRef:
        key: stripe-webhook-signing-secret
