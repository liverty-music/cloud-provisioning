# fan-api release gate (OpenSpec change add-prod-preview-release, D1, D8).
#
# Same shape as fan-web (frontend overlay, fan-web-rollout.yaml): the Rollout
# takes its Pod template from the base Deployment, which runs no Pods in prod.
# Every release is checked before it goes live: its Pod is first selected by
# fan-api-preview-svc (https://api.preview.liverty-music.app), the pre-promotion
# analysis below smoke-tests it through that Service, and only a pass switches
# fan-api-svc, the Rollout's activeService and the target of the fans' route. A
# failed check aborts the release and fans keep the current Pod. To also look at
# a release by hand before it goes live, merge autoPromotionEnabled: false
# before cutting it, and set it back afterwards
# (docs/runbooks/prod-image-tag-pinning.md).
#
# `activeMetadata` / `previewMetadata` label the Pods of each side. The webhook
# Service (Stripe, Zitadel actions) is not managed by the Rollout and selects
# `role: active` only (kustomization.yaml), so an unchecked release never
# receives a webhook.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: fan-api
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: fan-api
  workloadRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fan-api
  strategy:
    blueGreen:
      activeService: fan-api-svc
      previewService: fan-api-preview-svc
      autoPromotionEnabled: true
      # The new Pods must pass the preview smoke Job below before the switch.
      prePromotionAnalysis:
        templates:
        - templateName: fan-api-preview-smoke
      previewReplicaCount: 1
      # Keep the replaced Pods for 5 minutes after a promotion: requests the
      # load balancer still sends to them finish, and an abort right after a
      # promotion has Pods to return to.
      scaleDownDelaySeconds: 300
      activeMetadata:
        labels:
          role: active
      previewMetadata:
        labels:
          role: preview
---
# Selected by the preview HTTPRoute only. Same port and protocol as fan-api-svc.
apiVersion: v1
kind: Service
metadata:
  name: fan-api-preview-svc
spec:
  type: ClusterIP
  selector:
    app: fan-api
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
    appProtocol: kubernetes.io/h2c # HTTP/2 Cleartext
---
# The load balancer needs the same backend and health-check settings on the
# preview Service as on fan-api-svc (base/fan-api/backend-policy.yaml,
# health-check-policy.yaml).
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: fan-api-preview-policy
spec:
  default:
    timeoutSec: 60
    connectionDraining:
      drainingTimeoutSec: 60
  targetRef:
    group: ""
    kind: Service
    name: fan-api-preview-svc
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: fan-api-preview-policy
spec:
  default:
    checkIntervalSec: 5
    timeoutSec: 5
    healthyThreshold: 2
    unhealthyThreshold: 2
    config:
      type: GRPC
      grpcHealthCheck:
        port: 8080
  targetRef:
    group: ""
    kind: Service
    name: fan-api-preview-svc
---
# The preview address of the API (design D2). It routes the fan API's server
# port only. fan-api-webhook-svc is never a backend here, so the Stripe webhook
# and the internal Zitadel action endpoints (:9090) are not reachable on this
# address (same rule as base/fan-api/httproute.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: fan-api-preview-route
spec:
  parentRefs:
  - name: external-gateway
    namespace: gateway
  hostnames:
  - api.preview.liverty-music.app
  rules:
  - backendRefs:
    # The candidate lane (candidate.yaml), not the Rollout's preview Service:
    # the preview hostname must keep serving one warm instance while the
    # candidate is updated by a rolling update (design D1, task 8.3).
    - name: fan-api-candidate-svc
      port: 80
---
# Checks the new fan-api Pod through the preview Service before the Rollout
# switches the active Service (prePromotionAnalysis): a public read RPC that
# reaches the database. A failed Job aborts the release: fans keep the current
# Pod.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: fan-api-preview-smoke
spec:
  metrics:
  - name: preview-answers
    count: 1
    provider:
      job:
        spec:
          backoffLimit: 2
          # Hard stop: a Job that never starts (image pull, no capacity) must fail
          # the analysis, not leave the release waiting.
          activeDeadlineSeconds: 180
          ttlSecondsAfterFinished: 600
          template:
            spec:
              restartPolicy: Never
              securityContext:
                runAsNonRoot: true
                runAsUser: 100
                seccompProfile:
                  type: RuntimeDefault
              containers:
              - name: smoke
                image: curlimages/curl:8.11.1
                command:
                - sh
                - -ec
                - |
                  curl -fsS --max-time 10 -X POST \
                    -H 'content-type: application/json' -H 'connect-protocol-version: 1' \
                    -d '{"limit":1}' \
                    http://fan-api-preview-svc/liverty_music.rpc.artist.v1.ArtistService/ListTop \
                    | grep -q '"artists"'
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop: [ALL]
                resources:
                  requests:
                    cpu: 10m
                    memory: 16Mi
                    ephemeral-storage: 10Mi
                  limits:
                    cpu: 100m
                    memory: 32Mi
                    ephemeral-storage: 10Mi
