# fan-api release gate (OpenSpec change add-prod-preview-release, D1, D8).
#
# Same shape as fan-web (frontend overlay, fan-web-rollout.yaml): the Rollout
# takes its Pod template from the base Deployment, which runs no Pods in prod,
# and a new release stops with its Pods on fan-api-preview-svc
# (https://api.preview.liverty-music.app) while fan-api-svc, the Rollout's
# activeService and the target of the fans' route, keeps the current Pods.
#
# `activeMetadata` / `previewMetadata` label the Pods of each side. The webhook
# Service (Stripe, Zitadel actions) is not managed by the Rollout and selects
# `role: active` only (kustomization.yaml), so an unchecked release never
# receives a webhook.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: fan-api
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: fan-api
  workloadRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fan-api
  strategy:
    blueGreen:
      activeService: fan-api-svc
      previewService: fan-api-preview-svc
      autoPromotionEnabled: false
      previewReplicaCount: 1
      # Keep the replaced Pods for 5 minutes after a promotion: requests the
      # load balancer still sends to them finish, and an abort right after a
      # promotion has Pods to return to.
      scaleDownDelaySeconds: 300
      activeMetadata:
        labels:
          role: active
      previewMetadata:
        labels:
          role: preview
---
# Selected by the preview HTTPRoute only. Same port and protocol as fan-api-svc.
apiVersion: v1
kind: Service
metadata:
  name: fan-api-preview-svc
spec:
  type: ClusterIP
  selector:
    app: fan-api
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
    appProtocol: kubernetes.io/h2c # HTTP/2 Cleartext
---
# The load balancer needs the same backend and health-check settings on the
# preview Service as on fan-api-svc (base/fan-api/backend-policy.yaml,
# health-check-policy.yaml).
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: fan-api-preview-policy
spec:
  default:
    timeoutSec: 60
    connectionDraining:
      drainingTimeoutSec: 60
  targetRef:
    group: ""
    kind: Service
    name: fan-api-preview-svc
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: fan-api-preview-policy
spec:
  default:
    config:
      type: GRPC
      grpcHealthCheck:
        port: 8080
  targetRef:
    group: ""
    kind: Service
    name: fan-api-preview-svc
---
# The preview address of the API (design D2). It routes the fan API's server
# port only. fan-api-webhook-svc is never a backend here, so the Stripe webhook
# and the internal Zitadel action endpoints (:9090) are not reachable on this
# address (same rule as base/fan-api/httproute.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: fan-api-preview-route
spec:
  parentRefs:
  - name: external-gateway
    namespace: gateway
  hostnames:
  - api.preview.liverty-music.app
  rules:
  - backendRefs:
    - name: fan-api-preview-svc
      port: 80
