# Keep >=1 fan-api replica serving during voluntary disruptions (node drain,
# GKE node upgrade, autoscaler eviction). (PDBs do NOT cover Spot preemption /
# involuntary loss; that is handled by 2 replicas + node spread + on-demand
# fallback.) Safe because fan-api runs 2 replicas in prod.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fan-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: fan-api
