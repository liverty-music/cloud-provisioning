apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-sql-proxy
  labels:
    app: cloud-sql-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloud-sql-proxy
  template:
    metadata:
      labels:
        app: cloud-sql-proxy
    spec:
      # NOTE: prod ad-hoc DB access via this proxy is currently BROKEN at the
      # Cloud SQL PSC/proxy-auth layer (a port-forward + psql as any IAM user
      # returns "role does not exist", even for `backend-app` whose pg role
      # exists and is used by workloads via the in-process Go connector). Two
      # tracked gaps: (1) the `fan-api@<project>.iam` pg role is not
      # materialized (unify-workload-naming DB-role creation incomplete);
      # (2) the standalone --auto-iam-authn proxy path fails where the direct
      # connector path succeeds. Kept on `backend-app` (a real, granted role)
      # until those are fixed.
      serviceAccountName: backend-app
      nodeSelector:
        cloud.google.com/gke-spot: "true"
      containers:
      - name: cloud-sql-proxy
        image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2
        args:
        - --psc
        - --auto-iam-authn
        - --port=5432
        - --address=127.0.0.1
        - liverty-music-prod:asia-northeast2:postgres-osaka
        ports:
        - containerPort: 5432
          name: postgres
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          allowPrivilegeEscalation: false
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
