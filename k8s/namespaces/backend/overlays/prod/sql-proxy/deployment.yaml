apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-sql-proxy
  labels:
    app: cloud-sql-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloud-sql-proxy
  template:
    metadata:
      labels:
        app: cloud-sql-proxy
    spec:
      # Ad-hoc DB access proxy runs as `fan-api`, the audience-tier successor to
      # `backend-app` (unify-workload-naming). `fan-api@<project>.iam` is a live
      # Cloud SQL IAM user with app-schema CRUD (grant migration
      # 20260817010000) that the fan-api workload authenticates as, so
      # --auto-iam-authn connections through this proxy resolve to a role that
      # exists and is granted. `backend-app@<project>.iam` no longer maps to a
      # usable prod role, which broke port-forward access via this proxy.
      serviceAccountName: fan-api
      nodeSelector:
        cloud.google.com/gke-spot: "true"
      containers:
      - name: cloud-sql-proxy
        image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2
        args:
        - --psc
        - --auto-iam-authn
        - --port=5432
        - --address=127.0.0.1
        - liverty-music-prod:asia-northeast2:postgres-osaka
        ports:
        - containerPort: 5432
          name: postgres
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          allowPrivilegeEscalation: false
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
