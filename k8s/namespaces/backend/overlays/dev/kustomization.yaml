apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base
- sql-proxy/deployment.yaml

namespace: backend

patches:
# Target backend-app (no longer affected by namePrefix)
- path: serviceaccount_patch.yaml
  target:
    kind: ServiceAccount
    name: backend-app

# Bind KSA admin-console-api to its dedicated dev GSA (Workload Identity).
- path: serviceaccount_admin_console_api_patch.yaml
  target:
    kind: ServiceAccount
    name: admin-console-api

# Bind KSA fan-api to its dedicated dev GSA (unify-workload-naming create-new).
- path: serviceaccount_fan_api_patch.yaml
  target:
    kind: ServiceAccount
    name: fan-api

# Global Spot VM patch for all Deployments in dev
- path: spot-vm_patch.yaml
  target:
    kind: Deployment

# Spot VM patch for CronJobs in dev
- path: spot-vm_patch_cronjob.yaml
  target:
    kind: CronJob

# fan-api: single replica + dev sizing (unify-workload-naming).
# Replaces the deleted server-app as the fan-facing backend.
- target:
    kind: Deployment
    name: fan-api
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: fan-api
    spec:
      replicas: 1
- target:
    kind: Deployment
    name: fan-api
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: fan-api
    spec:
      template:
        spec:
          containers:
          - name: fan-api
            resources:
              requests:
                cpu: 10m
                memory: 60Mi
              limits:
                cpu: 200m
                memory: 256Mi

# Reduce replicas to 1 for admin-console-api in dev (low-volume admin traffic).
- target:
    kind: Deployment
    name: admin-console-api
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: admin-console-api
    spec:
      replicas: 1

# Env-specific ORGANIZER_CONSOLE_PROJECT_ID for admin-console-api ONLY (scoped
# to this Deployment's container env so it never leaks into server-app). Value
# is the Pulumi stack output `organizerConsoleProjectId`. Dev is intentionally
# stopped, so the output resolves to the DEV_SHUTDOWN sentinel (no admin workload
# runs there); the value is inert.
- target:
    kind: Deployment
    name: admin-console-api
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: admin-console-api
    spec:
      template:
        spec:
          containers:
          - name: server
            env:
            - name: ORGANIZER_CONSOLE_PROJECT_ID
              value: "DEV_SHUTDOWN_workloadEnabled=false"
            # Authenticate to Cloud SQL as admin-console-api's OWN IAM DB user
            # (overrides the backend-app DATABASE_USER from server-config via
            # envFrom). Dev is intentionally stopped, so this is inert, but kept
            # coherent with prod and the postgres.ts IAM SQL user.
            - name: DATABASE_USER
              value: "admin-console-api@liverty-music-dev.iam"

- target:
    kind: HTTPRoute
    name: fan-api-route
  patch: |-
    - op: add
      path: /spec/hostnames
      value: ["api.dev.liverty-music.app"]

- target:
    kind: HTTPRoute
    name: admin-console-api-route
  patch: |-
    - op: add
      path: /spec/hostnames
      value: ["api.admin.dev.liverty-music.app"]

# CronJob: run concert discovery only on Fridays in dev
- path: cronjob/concert-discovery/schedule_patch.yaml
  target:
    kind: CronJob
    name: concert-discovery-app

# CronJob: run merch discovery only on Fridays in dev
- path: cronjob/merch-discovery/schedule_patch.yaml
  target:
    kind: CronJob
    name: merch-discovery-app

# CronJob: run sales-phase discovery only on Fridays in dev
- path: cronjob/sales-phase-discovery/schedule_patch.yaml
  target:
    kind: CronJob
    name: sales-phase-discovery-app

# Right-size resources for event-consumer in dev
- target:
    kind: Deployment
    name: event-consumer
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: event-consumer
    spec:
      template:
        spec:
          containers:
          - name: consumer
            resources:
              requests:
                cpu: 10m
                memory: 20Mi
              limits:
                cpu: 200m
                memory: 128Mi

# Reduce maxReplicaCount for event-consumer ScaledObject in dev
- target:
    kind: ScaledObject
    name: event-consumer
  patch: |-
    apiVersion: keda.sh/v1alpha1
    kind: ScaledObject
    metadata:
      name: event-consumer
    spec:
      maxReplicaCount: 1

configMapGenerator:
- name: fan-api-config
  behavior: merge
  envs:
  - fan-api/configmap.env
- name: concert-discovery-job-config
  behavior: merge
  envs:
  - cronjob/concert-discovery/configmap.env
- name: artist-image-sync-job-config
  behavior: merge
  envs:
  - cronjob/artist-image-sync/configmap.env
- name: merch-discovery-job-config
  behavior: merge
  envs:
  - cronjob/merch-discovery/configmap.env
- name: sales-phase-discovery-job-config
  behavior: merge
  envs:
  - cronjob/sales-phase-discovery/configmap.env
- name: sales-reminders-job-config
  behavior: merge
  envs:
  - cronjob/sales-reminders/configmap.env
- name: event-consumer-config
  behavior: merge
  envs:
  - event-consumer/configmap.env
