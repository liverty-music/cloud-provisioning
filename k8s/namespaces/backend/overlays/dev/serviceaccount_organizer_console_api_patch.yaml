apiVersion: v1
kind: ServiceAccount
metadata:
  name: organizer-console-api
  annotations:
    # Dedicated least-privilege organizer-console-api GSA (Workload Identity),
    # created in kubernetes.ts. Its matching read-only IAM Cloud SQL user
    # (organizer-console-api@<project>.iam) is created in postgres.ts and matches
    # the DATABASE_USER override in the overlay.
    iam.gke.io/gcp-service-account: organizer-console-api@liverty-music-dev.iam.gserviceaccount.com
