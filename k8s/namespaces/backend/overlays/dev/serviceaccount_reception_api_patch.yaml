apiVersion: v1
kind: ServiceAccount
metadata:
  name: reception-api
  annotations:
    # Dedicated reception-api GSA (Workload Identity), created in kubernetes.ts.
    # Its reception-only IAM Cloud SQL user (reception-api@<project>.iam) is
    # created in postgres.ts and matches the DATABASE_USER override in the
    # overlay.
    iam.gke.io/gcp-service-account: reception-api@liverty-music-dev.iam.gserviceaccount.com
