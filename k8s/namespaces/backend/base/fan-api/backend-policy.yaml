apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: fan-api-policy
spec:
  default:
    # Longer than SERVER_HANDLER_TIMEOUT (30s), so the server, not the load
    # balancer, gives up a slow call and answers Unavailable.
    timeoutSec: 60
    connectionDraining:
      drainingTimeoutSec: 60
    # A GCPBackendPolicy without a `logging` section turns the load balancer
    # access log off, so it must be set here. sampleRate is an integer from 0 to
    # 1000000 (1000000 = every request). Every request is logged: failed calls
    # need the status, latency and backend response, and the volume is a few
    # thousand entries a day, well inside Cloud Logging's free allotment.
    # https://docs.cloud.google.com/kubernetes-engine/docs/how-to/configure-gateway-resources ("HTTP access logging")
    logging:
      enabled: true
      sampleRate: 1000000
  targetRef:
    group: ""
    kind: Service
    name: fan-api-svc # Referenced via kustomizeconfig.yaml 'nameReference'
