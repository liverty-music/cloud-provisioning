apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: fan-api-policy
spec:
  default:
    # Longer than SERVER_HANDLER_TIMEOUT (30s), so the server, not the load
    # balancer, gives up a slow call and answers Unavailable.
    timeoutSec: 60
    connectionDraining:
      drainingTimeoutSec: 60
  targetRef:
    group: ""
    kind: Service
    name: fan-api-svc # Referenced via kustomizeconfig.yaml 'nameReference'
