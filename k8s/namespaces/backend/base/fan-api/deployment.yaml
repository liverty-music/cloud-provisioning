apiVersion: apps/v1
kind: Deployment
metadata:
  name: fan-api
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 2
  strategy:
    rollingUpdate:
      maxUnavailable: 0
  template:
    metadata:
      # Labels handled by commonLabels
    spec:
      # Drain, per the GKE guidance (OpenSpec change add-prod-preview-release, D9):
      # terminationGracePeriod >= preStop + shutdown time, and preStop >=
      # connectionDraining.drainingTimeoutSec (fan-api-policy, 60 s) + drain
      # latency (GKE estimates one minute). The app gets SIGTERM only after the
      # preStop, and SHUTDOWN_TIMEOUT (configmap.env, 60 s) must fit after it:
      # 190 = 120 + 60 + 10 buffer.
      terminationGracePeriodSeconds: 190
      serviceAccountName: fan-api
      volumes:
      - name: zkp-verification-key
        configMap:
          name: fan-api-zkp-verification-key
      containers:
      - name: fan-api
        image: fan-api
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 9090
          name: webhook
        env:
        # The API deployment this process runs as (backend API_WORKLOAD). Every
        # API deployment runs the same binary; fan is the one that runs the
        # lottery draw, issuance and settlement sweepers.
        - name: API_WORKLOAD
          value: fan
        # Identity service listener for this workload: confirming an email
        # address with the code from its verification email, and nothing else.
        # The fan API holds no identity-provider key (OpenSpec change
        # fan-email-verification-in-app).
        - name: IDENTITY_SERVICE_URL
          value: http://identity:9102
        envFrom:
        - configMapRef:
            name: fan-api-config
        - secretRef:
            name: fan-api-backend-secrets
        # Stripe credentials, shared by every API workload. Required: the backend
        # refuses to start outside local without them.
        - secretRef:
            name: api-stripe-secrets
        volumeMounts:
        - name: zkp-verification-key
          mountPath: /configs/zkp/zkp-verification-key.json
          subPath: zkp-verification-key.json
          readOnly: true
        lifecycle:
          # Keeps serving while the load balancer drops this Pod's endpoint:
          # 60 s drain + 60 s estimated drain latency. A shorter sleep let the
          # load balancer keep sending to a Pod that had already stopped (GKE
          # docs, "Troubleshoot load balancing", 500 series errors with NEGs).
          preStop:
            sleep:
              seconds: 120
        readinessProbe:
          grpc:
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        # DI waits up to 5 minutes for the database before the server (and its
        # health service) starts, so liveness is held off until the process
        # answers: 36 x 10 s = 6 minutes.
        startupProbe:
          grpc:
            port: 8080
            service: liveness
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 36
        # The `liveness` health service reports only whether the process can
        # answer; readiness (default service) reports the database.
        livenessProbe:
          grpc:
            port: 8080
            service: liveness
          initialDelaySeconds: 10
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
            ephemeral-storage: 100Mi
          limits:
            cpu: 500m
            memory: 512Mi
            ephemeral-storage: 100Mi
