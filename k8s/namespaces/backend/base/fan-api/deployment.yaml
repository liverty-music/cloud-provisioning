apiVersion: apps/v1
kind: Deployment
metadata:
  name: fan-api
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 2
  strategy:
    rollingUpdate:
      maxUnavailable: 0
  template:
    metadata:
      # Labels handled by commonLabels
    spec:
      terminationGracePeriodSeconds: 75
      serviceAccountName: fan-api
      volumes:
      - name: zkp-verification-key
        configMap:
          name: fan-api-zkp-verification-key
      - name: zitadel-machine-key
        secret:
          secretName: fan-api-backend-secrets
          items:
          - key: zitadel-machine-key-for-backend-app.json
            path: zitadel-machine-key-for-backend-app.json
      containers:
      - name: fan-api
        image: fan-api
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 9090
          name: webhook
        env:
        # The API deployment this process runs as (backend API_WORKLOAD). Every
        # API deployment runs the same binary; fan is the one that runs the
        # lottery draw, issuance and settlement sweepers.
        - name: API_WORKLOAD
          value: fan
        envFrom:
        - configMapRef:
            name: fan-api-config
        - secretRef:
            name: fan-api-backend-secrets
        # Stripe credentials, shared by every API workload. Required: the backend
        # refuses to start outside local without them.
        - secretRef:
            name: api-stripe-secrets
        volumeMounts:
        - name: zkp-verification-key
          mountPath: /configs/zkp/zkp-verification-key.json
          subPath: zkp-verification-key.json
          readOnly: true
        - name: zitadel-machine-key
          mountPath: /secrets/zitadel
          readOnly: true
        lifecycle:
          preStop:
            exec:
              command: ["sleep", "5"]
        readinessProbe:
          grpc:
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          grpc:
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
            ephemeral-storage: 100Mi
          limits:
            cpu: 500m
            memory: 512Mi
            ephemeral-storage: 100Mi
