apiVersion: apps/v1
kind: Deployment
metadata:
  name: fan-api
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 2
  strategy:
    rollingUpdate:
      maxUnavailable: 0
  template:
    metadata:
      # Labels handled by commonLabels
    spec:
      terminationGracePeriodSeconds: 75
      serviceAccountName: fan-api
      volumes:
      - name: zkp-verification-key
        configMap:
          name: fan-api-zkp-verification-key
      - name: zitadel-machine-key
        secret:
          secretName: fan-api-backend-secrets
          items:
          - key: zitadel-machine-key-for-backend-app.json
            path: zitadel-machine-key-for-backend-app.json
      containers:
      - name: fan-api
        image: fan-api
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 9090
          name: webhook
        envFrom:
        - configMapRef:
            name: fan-api-config
        - secretRef:
            name: fan-api-backend-secrets
        # Stripe webhook signing secret, isolated + optional. The Secret
        # `fan-api-stripe-webhook-secret` is created by a dedicated ExternalSecret
        # added together with external prerequisite 0.1 (once the GSM secret
        # `stripe-webhook-signing-secret` exists). Wiring it optional here now means
        # 0.1 only adds that one ExternalSecret — no Deployment change. Until then
        # the Secret is absent: optional lets the pod start, and the webhook handler
        # fails closed (503) while STRIPE_WEBHOOK_SIGNING_SECRET is unset. Isolating
        # it (vs. the all-or-nothing fan-api-backend-secrets bundle) also keeps a
        # future signing-secret rotation fault from stranding every backend secret.
        - secretRef:
            name: fan-api-stripe-webhook-secret
            optional: true
        volumeMounts:
        - name: zkp-verification-key
          mountPath: /configs/zkp/zkp-verification-key.json
          subPath: zkp-verification-key.json
          readOnly: true
        - name: zitadel-machine-key
          mountPath: /secrets/zitadel
          readOnly: true
        lifecycle:
          preStop:
            exec:
              command: ["sleep", "5"]
        readinessProbe:
          grpc:
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          grpc:
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
