apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: fan-api-backend-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: google-secret-manager
    kind: ClusterSecretStore
  target:
    name: fan-api-backend-secrets
    creationPolicy: Owner
  data:
  - secretKey: LASTFM_API_KEY
    remoteRef:
      key: lastfm-api-key
  - secretKey: VAPID_PRIVATE_KEY
    remoteRef:
      key: vapid-private-key
  - secretKey: FANARTTV_API_KEY
    remoteRef:
      key: fanarttv-api-key
  # REQUIRED post-backend-#303; `gemini.NewConcertSearcher` fails fast when empty.
  - secretKey: GCP_GEMINI_SEARCH_API_KEY
    remoteRef:
      key: gemini-search-api-key
  - secretKey: zitadel-machine-key-for-backend-app.json
    remoteRef:
      key: zitadel-machine-key-for-backend-app
  # HMAC signing key for the login-event Actions v2 Target (PAYLOAD_TYPE_JSON).
  # The login-event webhook handler verifies the ZITADEL-Signature header with
  # it. GSM secret provisioned by Pulumi; this entry is safe to add now that the
  # secret exists (ESO v1beta1 fails the whole bundle if a referenced key is
  # absent).
  - secretKey: WEBHOOK_LOGIN_EVENT_SIGNING_KEY
    remoteRef:
      key: webhook-login-event-signing-key
  # Stripe secret key (test-mode) for the ④ lottery flow. GSM secret
  # `stripe-secret-key` is provisioned by Pulumi (cloud-provisioning #474); this
  # entry is safe only AFTER that secret exists + prod `pulumi up` has run — ESO
  # v1beta1 fails the whole fan-api-backend-secrets bundle if a referenced key is
  # absent. When the secret is unset the backend uses NoopAuthorizationPort.
  - secretKey: STRIPE_SECRET_KEY
    remoteRef:
      key: stripe-secret-key
  # Pocket Sign (PocketSign Stamp) Bearer token for the fan-api eKYC flow
  # (identity-ekyc-jpki). GSM secret provisioned by Pulumi conditionally on
  # `pulumiConfig.pocketSignToken`. ORDERING: only merge this AFTER `pulumi up`
  # has created `pocket-sign-token` — ESO v1beta1 fails the whole
  # fan-api-backend-secrets bundle if a referenced remote key is absent.
  - secretKey: POCKET_SIGN_TOKEN
    remoteRef:
      key: pocket-sign-token
