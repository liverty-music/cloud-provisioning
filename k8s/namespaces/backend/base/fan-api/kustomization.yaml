apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# fan-api: audience-tier successor to `server` (unify-workload-naming). Now the
# sole fan-facing backend workload — the old `server` workload is deleted at
# delete-old and `fan-api-route` (below) takes over api.liverty-music.app.
resources:
- serviceaccount.yaml
- deployment.yaml
- service.yaml
- service-webhook.yaml
- health-check-policy.yaml
- backend-policy.yaml
- httproute.yaml
- external-secret.yaml

configurations:
- kustomizeconfig.yaml

labels:
- includeSelectors: true
  pairs:
    app: fan-api

# Shared API-server binary image (unify-workload-naming): fan-api pulls the
# audience-neutral `backend/api`, the successor to `backend/fan-api`/`backend/server`.
# admin-console-api pulls the SAME image, so the two API workloads never drift.
# The bare container `image: fan-api` is the match key rewritten to the dev-AR
# form; the prod overlay last-write-wins to the prod AR + semver pin on backend/api.
images:
- name: fan-api
  newName: asia-northeast2-docker.pkg.dev/liverty-music-dev/backend/api
  newTag: latest

configMapGenerator:
- name: fan-api-config
  envs:
  - configmap.env
- name: fan-api-zkp-verification-key
  files:
  - zkp-verification-key.json
