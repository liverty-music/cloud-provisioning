apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# fan-api: audience-tier successor to `server` (unify-workload-naming, phase 2c
# create-new). Cloned from base/server ADDITIVELY — the live `server-app` stays
# until the fan cutover repoints `api.liverty-music.app` to fan-api and the old
# resources are deleted. The HTTPRoute is intentionally OMITTED here so the new
# workload runs detached (no Gateway hostname claimed → no route conflict with
# server-route); the route is added at cutover.
resources:
- serviceaccount.yaml
- deployment.yaml
- service.yaml
- service-webhook.yaml
- health-check-policy.yaml
- backend-policy.yaml
- external-secret.yaml

configurations:
- kustomizeconfig.yaml

labels:
- includeSelectors: true
  pairs:
    app: fan-api

images:
- name: fan-api
  newName: asia-northeast2-docker.pkg.dev/liverty-music-dev/backend/fan-api
  newTag: latest

configMapGenerator:
- name: fan-api-config
  envs:
  - configmap.env
- name: fan-api-zkp-verification-key
  files:
  - zkp-verification-key.json
