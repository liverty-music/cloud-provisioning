apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# fan-api: audience-tier successor to `server` (unify-workload-naming). Now the
# sole fan-facing backend workload — the old `server` workload is deleted at
# delete-old and `fan-api-route` (below) takes over api.liverty-music.app.
resources:
- serviceaccount.yaml
- deployment.yaml
- service.yaml
- service-webhook.yaml
- health-check-policy.yaml
- backend-policy.yaml
- httproute.yaml
- external-secret.yaml

configurations:
- kustomizeconfig.yaml

labels:
- includeSelectors: true
  pairs:
    app: fan-api

images:
- name: fan-api
  newName: asia-northeast2-docker.pkg.dev/liverty-music-dev/backend/fan-api
  newTag: latest

configMapGenerator:
- name: fan-api-config
  envs:
  - configmap.env
- name: fan-api-zkp-verification-key
  files:
  - zkp-verification-key.json
