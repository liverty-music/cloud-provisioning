apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- cronjob.yaml

labels:
- includeSelectors: true
  pairs:
    app: artist-refresh

images:
- name: artist-refresh
  newName: asia-northeast2-docker.pkg.dev/liverty-music-dev/backend/artist-refresh
  newTag: latest

configMapGenerator:
- name: artist-refresh-job-config
  envs:
  - configmap.env
