apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- cronjob.yaml

labels:
- includeSelectors: true
  pairs:
    app: venue-coordinates-refresh

images:
- name: venue-coordinates-refresh
  newName: asia-northeast2-docker.pkg.dev/liverty-music-dev/backend/venue-coordinates-refresh
  newTag: latest

configMapGenerator:
- name: venue-coordinates-refresh-job-config
  envs:
  - configmap.env
