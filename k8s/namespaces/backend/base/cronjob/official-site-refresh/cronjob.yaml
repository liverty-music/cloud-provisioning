apiVersion: batch/v1
kind: CronJob
metadata:
  name: official-site-refresh-app
spec:
  schedule: "0 19 * * *" # 04:00 JST daily (no MusicBrainz traffic observed at this hour)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Delete finished Jobs (and their Pods) after a day so completed and
      # failed runs stop accumulating (optimize-prod-gke-cost D7). The history
      # limits above still cap the count within that day.
      ttlSecondsAfterFinished: 86400
      # A failed run is not retried: the job exits non-zero on a systemic
      # failure (an unreachable dependency, an API quota) that a retry would
      # hit again; the next scheduled run is the retry.
      backoffLimit: 0
      template:
        spec:
          terminationGracePeriodSeconds: 120
          serviceAccountName: backend-app
          restartPolicy: Never
          containers:
          - name: official-site-refresh
            image: official-site-refresh
            imagePullPolicy: Always
            envFrom:
            - configMapRef:
                name: official-site-refresh-job-config
            - secretRef:
                name: backend-secrets
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
                ephemeral-storage: 100Mi
              limits:
                cpu: 250m
                memory: 256Mi
                ephemeral-storage: 100Mi
