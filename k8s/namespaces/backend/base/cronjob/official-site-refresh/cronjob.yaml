apiVersion: batch/v1
kind: CronJob
metadata:
  name: official-site-refresh-app
spec:
  schedule: "0 19 * * *" # 04:00 JST daily (no MusicBrainz traffic observed at this hour)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          terminationGracePeriodSeconds: 120
          serviceAccountName: backend-app
          restartPolicy: Never
          containers:
          - name: official-site-refresh
            image: official-site-refresh
            imagePullPolicy: Always
            envFrom:
            - configMapRef:
                name: official-site-refresh-job-config
            - secretRef:
                name: backend-secrets
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
                ephemeral-storage: 100Mi
              limits:
                cpu: 250m
                memory: 256Mi
                ephemeral-storage: 100Mi
