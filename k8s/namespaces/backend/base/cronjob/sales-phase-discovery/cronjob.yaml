apiVersion: batch/v1
kind: CronJob
metadata:
  name: sales-phase-discovery-app
spec:
  schedule: "0 12 * * *" # 21:00 JST daily
  concurrencyPolicy: Forbid
  # Explicit so lifting a suspend patch is applied: ArgoCD does not reset a
  # field that disappears from the manifest, so removing the patch alone left
  # the live CronJob suspended.
  suspend: false
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Delete finished Jobs (and their Pods) after a day so completed and
      # failed runs stop accumulating (optimize-prod-gke-cost D7). The history
      # limits above still cap the count within that day.
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          terminationGracePeriodSeconds: 120
          serviceAccountName: backend-app
          restartPolicy: Never
          containers:
          - name: sales-phase-discovery
            image: sales-phase-discovery
            imagePullPolicy: Always
            envFrom:
            - configMapRef:
                name: sales-phase-discovery-job-config
            - secretRef:
                name: backend-secrets
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
                ephemeral-storage: 100Mi
              limits:
                cpu: 500m
                memory: 512Mi
                ephemeral-storage: 100Mi
