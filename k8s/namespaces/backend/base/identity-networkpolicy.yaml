apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  # Ingress to the identity service, per port: 9100 from the workflow worker
  # (and the event consumer until publish-events-through-outbox is released),
  # 9101 from the admin console API, 9102 from the fan API, 8080 (gRPC health)
  # for the kubelet probes. Everything else, including every other pod, is
  # denied. Enforced by Dataplane V2. OpenSpec changes `identity-service`
  # (design D3), `fan-email-verification-in-app` (design D3) and
  # `delete-fan-accounts` (design D3).
  name: identity-ingress
spec:
  podSelector:
    matchLabels:
      app: identity
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: workflow-worker
    - podSelector:
        matchLabels:
          app: event-consumer
    ports:
    - protocol: TCP
      port: 9100
  - from:
    - podSelector:
        matchLabels:
          app: admin-console-api
    ports:
    - protocol: TCP
      port: 9101
  # The fan API's listener serves VerifyEmail, which needs a code only the
  # address owner has, and DeleteIdentity for a fan deleting their own account,
  # after the fan API checks that fan's fresh sign-in (OpenSpec change
  # delete-fan-accounts, design D3).
  - from:
    - podSelector:
        matchLabels:
          app: fan-api
    ports:
    - protocol: TCP
      port: 9102
  # The probes come from the node; the health check reveals nothing.
  - ports:
    - protocol: TCP
      port: 8080
