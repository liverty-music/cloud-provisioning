apiVersion: v1
kind: ServiceAccount
metadata:
  name: series-image-consumer
  annotations:
    # Dedicated series-image-consumer GSA (Workload Identity), created in
    # kubernetes.ts. It holds bucket-scoped write roles on both the private
    # originals bucket and the served bucket (granted in object-storage.ts) and
    # Cloud SQL Client / Instance User for its own IAM DB user. Overlays patch this annotation with the env-specific GSA (see
    # overlays/{dev,prod}).
    iam.gke.io/gcp-service-account: REPLACE_ME_IN_OVERLAY
