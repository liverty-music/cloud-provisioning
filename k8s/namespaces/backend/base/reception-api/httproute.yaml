apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  # reception-api-route: owns api.reception.liverty-music.app (hostname patched
  # per overlay) -> reception-api-svc.
  name: reception-api-route
spec:
  parentRefs:
  - name: external-gateway
    namespace: gateway
  rules:
  - backendRefs:
    - name: reception-api-svc
      port: 80
