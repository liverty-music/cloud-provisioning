apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow-worker
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  # One worker, and never two at once: the worker recovers the workflows of
  # its fixed executor id, so a second Pod would run them twice. maxSurge=0
  # stops the old Pod before the new one starts, as event-consumer does.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    spec:
      # The runtime waits up to 30 s for running workflows to stop; a workflow
      # it interrupts is resumed by the next Pod.
      terminationGracePeriodSeconds: 60
      serviceAccountName: fan-api
      containers:
      - name: worker
        image: worker
        imagePullPolicy: Always
        ports:
        - containerPort: 8081
          name: health
        env:
        # One pool of 5 shared by the workflows and DBOS, DBOS's documented
        # minimum; with Zitadel and the other workloads the instance stays
        # within 22 of its 25 connections (design "Connections"). `env` takes
        # precedence over the fan-api share in fan-api-config.
        - name: DATABASE_MAX_OPEN_CONNS
          value: "5"
        - name: DATABASE_MAX_IDLE_CONNS
          value: "1"
        - name: TELEMETRY_SERVICE_NAME
          value: liverty-music-workflow-worker
        # The identity service's listener for the backend workloads: the
        # verification emails and passkey recovery links of the user
        # workflows (OpenSpec change publish-events-through-outbox). The
        # worker holds no identity-provider key.
        - name: IDENTITY_SERVICE_URL
          value: http://identity:9100
        # The pipeline signal of each create-from-discovered batch goes to the
        # same PostHog project as the event consumer's.
        - name: POSTHOG_API_HOST
          valueFrom:
            configMapKeyRef:
              name: event-consumer-config
              key: POSTHOG_API_HOST
        - name: POSTHOG_PROJECT_API_KEY
          valueFrom:
            configMapKeyRef:
              name: event-consumer-config
              key: POSTHOG_PROJECT_API_KEY
        envFrom:
        - configMapRef:
            name: fan-api-config
        - secretRef:
            name: fan-api-backend-secrets
        - secretRef:
            name: api-stripe-secrets
        # POSTMARK_SERVER_TOKEN, for the emails of the user workflows.
        - secretRef:
            name: backend-secrets
        # Ready only once the runtime runs its queues and schedules. The worker
        # waits up to 5 minutes for the database and 5 more for DBOS's tables.
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        # Alive whenever the process answers, database or not, so a database
        # that is down at start never gets the Pod restarted. /healthz answers
        # from the first second, so no startupProbe is needed.
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            cpu: 10m
            # 73 MB at the peak of 600 runs in a local run of every workflow
            # (design "Migration Plan" of publish-events-through-outbox).
            memory: 96Mi
            ephemeral-storage: 100Mi
          limits:
            cpu: 200m
            memory: 256Mi
            ephemeral-storage: 100Mi
