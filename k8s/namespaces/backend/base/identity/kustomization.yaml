apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# identity: the identity service, the only workload that holds the
# identity-provider (Zitadel) keys. It has no database and no route from
# outside the cluster; NetworkPolicy identity-ingress (in the parent base, see
# there) admits only its callers.
# OpenSpec change `identity-service`.
resources:
- serviceaccount.yaml
- deployment.yaml
- service.yaml
- external-secret.yaml

labels:
- includeSelectors: true
  pairs:
    app: identity

# The bare container `image: identity` is rewritten to the dev-AR form here; the
# prod overlay last-write-wins to the prod AR + semver pin.
images:
- name: identity
  newName: asia-northeast2-docker.pkg.dev/liverty-music-dev/backend/identity
  newTag: latest

configMapGenerator:
- name: identity-config
  envs:
  - configmap.env
