apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  # The three identity-provider keys, mounted only on the identity Deployment.
  # GSM grants accessor on them to the ESO SA alone.
  #   - backend-app (ORG_USER_MANAGER on the product org): verification emails
  #     and fan identity removal
  #   - fan-passkey-recovery (ORG_OWNER on the product org): passkey
  #     registration links
  #   - organizer-provisioner (IAM_ORG_MANAGER): Organizers' Organizations
  name: identity-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: google-secret-manager
    kind: ClusterSecretStore
  target:
    name: identity-secrets
    creationPolicy: Owner
  data:
  - secretKey: zitadel-machine-key-for-backend-app.json
    remoteRef:
      key: zitadel-machine-key-for-backend-app
  - secretKey: zitadel-machine-key-for-fan-passkey-recovery.json
    remoteRef:
      key: zitadel-machine-key-for-fan-passkey-recovery
  - secretKey: zitadel-machine-key-for-organizer-provisioner.json
    remoteRef:
      key: zitadel-machine-key-for-organizer-provisioner
