apiVersion: v1
kind: ServiceAccount
metadata:
  name: organizer-console-api
  annotations:
    # Overlays patch this annotation with the env-specific GSA (see
    # overlays/{dev,prod}). This change provisions no dedicated organizer GSA;
    # the workload reuses the existing admin-console-api GSA (Workload Identity +
    # IAM Cloud SQL user), so the annotation resolves to admin-console-api@<project>.
    iam.gke.io/gcp-service-account: REPLACE_ME_IN_OVERLAY
