apiVersion: apps/v1
kind: Deployment
metadata:
  name: organizer-console-api
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 2
  # Keeps the old Pod until the new one has been Ready for this long. The NEG
  # readiness gate does not wait for the load balancer in this cluster, so
  # without this the old Pod stops before the new endpoint passes the load
  # balancer's health check (about 19 s) and requests get 503 (OpenSpec change
  # add-prod-preview-release, D1 and D9; measured on fan-web). 45 s covers it.
  minReadySeconds: 45
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      # `app: organizer-console-api` (with selector) is applied by this sub-base's
      # own `labels` transformer in kustomization.yaml — it does NOT inherit the
      # `server/` sub-base's `app: server`. This is the selector-isolation
      # mechanism: organizer-console-api Pods never carry `app: server`, so the
      # consumer `server-svc` / `server-webhook-svc` (selector `app: server`)
      # can never route to them, and `organizer-console-api-svc` (selector
      # `app: organizer-console-api`) routes ONLY to these Pods.
    spec:
      # Drain, per the GKE guidance (D9): terminationGracePeriod >= preStop +
      # shutdown time, and preStop >= drainingTimeoutSec (backend-policy.yaml,
      # 60 s) + drain latency (GKE estimates one minute). The app gets SIGTERM
      # only after the preStop, and SHUTDOWN_TIMEOUT (fan-api-config, 60 s) must
      # fit after it: 190 = 120 + 60 + 10 buffer.
      terminationGracePeriodSeconds: 190
      serviceAccountName: organizer-console-api
      # No identity-provider management credential: the organizer workload
      # routes nothing that uses one, and the backend does not require it here
      # (OpenSpec change remove-identity-key-from-fan-api).
      volumes:
      # The introspection key of this API's ZITADEL API application. Not
      # optional: until ESO has synced the Secret the pod waits in
      # ContainerCreating, and the backend refuses to start without it.
      - name: introspection-key
        secret:
          secretName: organizer-console-api-introspection-key
      containers:
      - name: server
        image: server
        imagePullPolicy: Always
        ports:
        # The single backend binary always starts the main (8080), admin (8090),
        # organizer (8091), and webhook (9090) listeners. Declare 8080 so the pod
        # boots healthy on the main listener, and 8091 (organizer) — the ONLY port
        # routed for this workload via organizer-console-api-svc.
        - containerPort: 8080
          name: http
        - containerPort: 8091
          name: http-organizer
        env:
        # The API deployment this process runs as (backend API_WORKLOAD).
        # organizer does not provision tenants.
        - name: API_WORKLOAD
          value: organizer
        # Env-specific organizer-console Zitadel project id. The organizer server's
        # OrgScopedInterceptor requires this project id to appear in the token `aud`;
        # an empty value denies every request. Scoped to this Deployment's container
        # env so it never leaks into the fan/consumer workloads. Value is the Pulumi
        # stack output `organizerConsoleProjectId`; set per overlay.
        - name: ORGANIZER_CONSOLE_PROJECT_ID
          value: REPLACE_ME_IN_OVERLAY
        # The key the organizer API asks ZITADEL with whether a token is active
        # (introspection). It cannot read or change identities: this API holds
        # no identity-provider management key.
        - name: ZITADEL_INTROSPECTION_KEY_FOR_ORGANIZER_CONSOLE_API_PATH
          value: /secrets/zitadel/zitadel-introspection-key-for-organizer-console-api.json
        # Authenticate to Cloud SQL as this workload's OWN IAM DB user. An explicit
        # container `env` entry overrides the value supplied by `envFrom`
        # (fan-api-config, which carries the fan-api DATABASE_USER) — Kubernetes
        # gives precedence to `env` over `envFrom` for the same key. Set per overlay.
        - name: DATABASE_USER
          value: REPLACE_ME_IN_OVERLAY
        # A pool of one: fan-api-config (envFrom) carries fan-api's share of
        # the connection budget, and `env` takes precedence over it (OpenSpec
        # change introduce-durable-workflows, design "Connections").
        - name: DATABASE_MAX_OPEN_CONNS
          value: "1"
        - name: DATABASE_MAX_IDLE_CONNS
          value: "1"
        envFrom:
        # Config: organizer borrows fan-api-config (identical content;
        # DATABASE_USER overridden above; ORGANIZER_CORS_ALLOWED_ORIGINS supplied
        # via the overlay merge into fan-api-config).
        # Secret: the namespace-shared backend-secrets (relocated ExternalSecret).
        - configMapRef:
            name: fan-api-config
        - secretRef:
            name: backend-secrets
        # Stripe credentials, for payout onboarding. Required: the backend refuses to
        # start outside local without them.
        - secretRef:
            name: api-stripe-secrets
        volumeMounts:
        - name: introspection-key
          mountPath: /secrets/zitadel
          readOnly: true
        lifecycle:
          # Keeps serving while the load balancer drops this Pod's endpoint:
          # 60 s drain + 60 s estimated drain latency.
          preStop:
            sleep:
              seconds: 120
        readinessProbe:
          grpc:
            port: 8091
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        # DI waits up to 5 minutes for the database before the server (and its
        # health service) starts, so liveness is held off until the process
        # answers: 36 x 10 s = 6 minutes.
        startupProbe:
          grpc:
            port: 8091
            service: liveness
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 36
        # The `liveness` health service reports only whether the process can
        # answer; readiness (default service) reports the database.
        livenessProbe:
          grpc:
            port: 8091
            service: liveness
          initialDelaySeconds: 10
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
            ephemeral-storage: 100Mi
          limits:
            cpu: 200m
            memory: 256Mi
            ephemeral-storage: 100Mi
