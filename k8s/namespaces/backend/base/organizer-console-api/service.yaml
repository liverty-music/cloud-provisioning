apiVersion: v1
kind: Service
metadata:
  name: organizer-console-api-svc
spec:
  type: ClusterIP
  # Selects ONLY organizer-console-api Pods. This sub-base's `labels` transformer
  # stamps `app: organizer-console-api` (with selector) onto both this Service and
  # the organizer-console-api Pods, so this Service can never route organizer
  # traffic to the Noop server-app Pods (which carry `app: server`).
  ports:
  - port: 80
    targetPort: 8091
    protocol: TCP
    name: http-organizer
    appProtocol: kubernetes.io/h2c # HTTP/2 Cleartext
