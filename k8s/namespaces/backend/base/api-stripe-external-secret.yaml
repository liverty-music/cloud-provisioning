# Stripe credentials for every API workload (fan-api, admin-console-api,
# organizer-console-api). The backend refuses to start outside local without
# STRIPE_SECRET_KEY and STRIPE_WEBHOOK_SIGNING_SECRET, so all three reference
# this Secret through a required envFrom:
#   - fan-api: lottery authorization/capture, issuance and settlement sweepers,
#     and the Stripe webhook.
#   - admin-console-api: OrderService.Refund.
#   - organizer-console-api: payout onboarding (Connect account + onboarding link).
# Which workload runs the payment sweepers is decided by API_WORKLOAD, not by
# the presence of these keys.
#
# Kept apart from the general backend secret bundles so a fault in a Stripe
# secret (e.g. during a signing-secret rotation) cannot strand every other
# backend secret: ESO fails a whole bundle when one remote key is absent.
#
# Both GSM secrets are written by Pulumi, never by hand (src/gcp/index.ts):
#   - `stripe-secret-key` from ESC `pulumiConfig.stripeSecretKey`;
#   - `stripe-webhook-signing-secret` from the webhook endpoint the stack
#     registers with ESC `pulumiConfig.stripeWebhookAdminKey` (prod only today).
# Dev has neither (no dev Stripe environment), so its API pods will not start
# until dev gets one through ESC and Pulumi.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-stripe-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: google-secret-manager
    kind: ClusterSecretStore
  target:
    name: api-stripe-secrets
    creationPolicy: Owner
  data:
  - secretKey: STRIPE_SECRET_KEY
    remoteRef:
      key: stripe-secret-key
  - secretKey: STRIPE_WEBHOOK_SIGNING_SECRET
    remoteRef:
      key: stripe-webhook-signing-secret
