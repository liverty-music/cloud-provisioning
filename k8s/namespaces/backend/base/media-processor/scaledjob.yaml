apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  # media-processor: KEDA-scaled batch worker that transcodes organizer-uploaded
  # media. Unlike the always-on event-consumer (a ScaledObject over a long-lived
  # Deployment), each `media.uploaded` event spawns a short-lived Job that reads
  # the original from the private originals bucket, transcodes it with libvips,
  # writes processed variants to the served bucket, then exits. A ScaledJob
  # (scale-to-zero, one Job per unit of work) fits this bursty, CPU/memory-heavy
  # per-item workload better than a resident Deployment.
  name: media-processor
spec:
  # KEDA polls the MEDIA JetStream durable and creates Jobs to drain the backlog.
  pollingInterval: 30
  # Keep the last few Jobs for post-mortem; KEDA garbage-collects the rest.
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  # Cap concurrent Jobs so a burst of uploads cannot exhaust the node pool.
  maxReplicaCount: 3
  scalingStrategy:
    strategy: default
  # Job template — one transcode per Job, never restarted in-place (a failed
  # transcode is retried by a fresh Job up to backoffLimit; watermill redelivery
  # + the POISON dead-letter path own at-least-once semantics).
  jobTargetRef:
    parallelism: 1
    completions: 1
    backoffLimit: 3
    template:
      spec:
        terminationGracePeriodSeconds: 90
        serviceAccountName: media-processor
        restartPolicy: Never
        containers:
        - name: media-processor
          image: media-processor
          imagePullPolicy: Always
          envFrom:
          - configMapRef:
              name: media-processor-config
          - secretRef:
              name: backend-secrets
          # libvips transcodes decode the full image into memory; size requests
          # for the largest expected original plus working buffers. Overlays
          # right-size per environment.
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
  triggers:
  # MEDIA stream — `media.uploaded` events. The `consumer` MUST exactly match the
  # live JetStream durable the backend creates (durable == deliver group ==
  # `media_uploaded`), else the scaler reports `<unknown>` and never scales up.
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: "nats.nats.svc.cluster.local:8222"
      account: "$G"
      stream: "MEDIA"
      consumer: "media_uploaded"
      lagThreshold: "1"
      activationLagThreshold: "0"
