apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- serviceaccount.yaml
- scaledjob.yaml

labels:
- includeSelectors: true
  pairs:
    app: media-processor

# The bare container `image: media-processor` is rewritten to the dev-AR form
# here; the prod overlay last-write-wins to the prod AR + semver pin. Mirrors the
# event-consumer base's image transformer.
images:
- name: media-processor
  newName: asia-northeast2-docker.pkg.dev/liverty-music-dev/backend/media-processor
  newTag: latest

configMapGenerator:
- name: media-processor-config
  envs:
  - configmap.env

# Propagate the configMapGenerator name-hash suffix into the ScaledJob (a CRD),
# which the built-in nameReference transformer does not cover — see
# kustomizeconfig.yaml.
configurations:
- kustomizeconfig.yaml
