apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- serviceaccount.yaml
- scaledjob.yaml

labels:
- includeSelectors: true
  pairs:
    app: media-processor

# The bare container `image: media-processor` is rewritten to the dev-AR form
# here; the prod overlay last-write-wins to the prod AR + semver pin. Mirrors the
# event-consumer base's image transformer.
images:
- name: media-processor
  newName: asia-northeast2-docker.pkg.dev/liverty-music-dev/media-processor/media-processor
  newTag: latest

configMapGenerator:
- name: media-processor-config
  envs:
  - configmap.env
