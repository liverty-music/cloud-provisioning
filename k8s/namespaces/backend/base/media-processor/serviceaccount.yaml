apiVersion: v1
kind: ServiceAccount
metadata:
  name: media-processor
  annotations:
    # Dedicated media-processor GSA (Workload Identity), created in kubernetes.ts.
    # It holds bucket-scoped storage.objectAdmin on both the private originals
    # bucket and the served bucket (granted in organizer-media.ts); no Cloud SQL
    # access. Overlays patch this annotation with the env-specific GSA (see
    # overlays/{dev,prod}).
    iam.gke.io/gcp-service-account: REPLACE_ME_IN_OVERLAY
