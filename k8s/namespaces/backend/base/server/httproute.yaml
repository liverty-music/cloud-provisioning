apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: server-route
spec:
  parentRefs:
  - name: external-gateway
    namespace: gateway
  rules:
  # unify-workload-naming fan CUTOVER: the api.liverty-music.app backend is
  # repointed from server-svc to fan-api-svc. This is an atomic single-field
  # swap on the one existing route (no dual-route-same-hostname conflict, no
  # routing gap). The route keeps the name `server-route` until delete-old,
  # where it is replaced by `fan-api-route` and server-app is removed.
  # Rollback until then = revert this backendRef to server-svc (server-app is
  # still running and healthy).
  - backendRefs:
    - name: fan-api-svc
      port: 80
