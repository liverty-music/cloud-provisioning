apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: admin-console-api-policy
spec:
  default:
    config:
      type: GRPC
      grpcHealthCheck:
        port: 8090
  targetRef:
    group: ""
    kind: Service
    name: admin-console-api-svc # Referenced via kustomizeconfig.yaml 'nameReference'
