apiVersion: v1
kind: Service
metadata:
  name: admin-console-api-svc
spec:
  type: ClusterIP
  # Selects ONLY admin-console-api Pods. This sub-base's `labels` transformer
  # stamps `app: admin-console-api` (with selector) onto both this Service and
  # the admin-console-api Pods, so this Service can never route admin traffic to
  # the Noop server-app Pods (which carry `app: server`).
  ports:
  - port: 80
    targetPort: 8090
    protocol: TCP
    name: http-admin
    appProtocol: kubernetes.io/h2c # HTTP/2 Cleartext
