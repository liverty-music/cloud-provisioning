apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  # admin-console-api-route (unify-workload-naming): the admin API route,
  # successor to server-admin-route. Owns api.admin.liverty-music.app (hostname
  # patched per overlay) -> admin-console-api-svc. Renamed off the retired
  # `server` workload name to match its workload (the last old-named route; 7.3).
  name: admin-console-api-route
spec:
  # Shares the external gateway with the consumer API route; hostnames
  # (api.admin.{env}) are patched per overlay. Consumer routing is untouched.
  parentRefs:
  - name: external-gateway
    namespace: gateway
  rules:
  - backendRefs:
    - name: admin-console-api-svc
      port: 80
