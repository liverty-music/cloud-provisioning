apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  # Name is intentionally KEPT as `server-admin-route` (not renamed to match the
  # workload) so the existing per-overlay hostname patches — which target
  # `HTTPRoute name: server-admin-route` — keep applying unchanged. Only the
  # backend was migrated: backendRefs now point at admin-console-api-svc.
  name: server-admin-route
spec:
  # Shares the external gateway with the consumer API route; hostnames
  # (api.admin.{env}) are patched per overlay. Consumer routing is untouched.
  parentRefs:
  - name: external-gateway
    namespace: gateway
  rules:
  - backendRefs:
    - name: admin-console-api-svc
      port: 80
