apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: admin-console-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: google-secret-manager
    kind: ClusterSecretStore
  target:
    # Dedicated Secret — the powerful organizer-provisioner key is kept OUT of
    # the shared backend-secrets that server-app mounts. Only admin-console-api
    # mounts this Secret.
    name: admin-console-secrets
    creationPolicy: Owner
  data:
  - secretKey: zitadel-machine-key-for-organizer-provisioner.json
    remoteRef:
      key: zitadel-machine-key-for-organizer-provisioner
