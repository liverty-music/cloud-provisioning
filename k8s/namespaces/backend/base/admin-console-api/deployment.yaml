apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-console-api
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 2
  # Keeps an old Pod until the new one has been Ready for this long. The NEG
  # readiness gate does not wait for the load balancer in this cluster, so
  # without this the old Pod stops before the new endpoint passes the load
  # balancer's health check (about 19 s) and requests get 503 (OpenSpec change
  # add-prod-preview-release, D1 and D9; measured on fan-web). 45 s covers it.
  # It only helps with two or more replicas: prod runs one until the launch HA
  # step (overlays/prod/kustomization.yaml).
  minReadySeconds: 45
  # Replace the Pod in place instead of starting a second one first. A surge Pod
  # opens its own connection pool next to the old one, and every backend release
  # rolls all workloads at once: on 2026-11-25 that took the database past its
  # connection limit and failed requests of fan-api and others. With one replica
  # the price is a gap of about a minute while the new Pod starts and passes the
  # load balancer's health check, so do not release while this API is in use (a
  # venue entry for reception-api). See the budget table in
  # src/gcp/components/postgres.ts.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  template:
    metadata:
      # `app: admin-console-api` (with selector) is applied by this sub-base's
      # own `labels` transformer in kustomization.yaml — it does NOT inherit the
      # `server/` sub-base's `app: server`. This is the selector-isolation
      # mechanism: admin-console-api Pods never carry `app: server`, so the
      # consumer `server-svc` / `server-webhook-svc` (selector `app: server`)
      # can never route to them, and `admin-console-api-svc` (selector
      # `app: admin-console-api`) routes ONLY to these Pods.
    spec:
      # Drain, per the GKE guidance (D9): terminationGracePeriod >= preStop +
      # shutdown time, and preStop >= drainingTimeoutSec (backend-policy.yaml,
      # 60 s) + drain latency (GKE estimates one minute). The app gets SIGTERM
      # only after the preStop, and SHUTDOWN_TIMEOUT (fan-api-config, 60 s) must
      # fit after it: 190 = 120 + 60 + 10 buffer.
      terminationGracePeriodSeconds: 190
      serviceAccountName: admin-console-api
      containers:
      - name: server
        image: server
        imagePullPolicy: Always
        ports:
        # The single backend binary always starts the main (8080), admin (8090),
        # and webhook (9090) listeners. Declare 8080 so the pod boots healthy on
        # the main listener, and 8090 (admin) — the ONLY port routed for this
        # workload via admin-console-api-svc.
        - containerPort: 8080
          name: http
        - containerPort: 8090
          name: http-admin
        env:
        # The API deployment this process runs as (backend API_WORKLOAD). admin
        # is the only workload that provisions Organizers' Organizations, through
        # the identity service below.
        - name: API_WORKLOAD
          value: admin
        # Identity service listener for this workload: fan identity removal and
        # Organization provisioning go through it. The admin console API holds
        # no identity-provider key (OpenSpec change identity-service).
        - name: IDENTITY_SERVICE_URL
          value: http://identity:9101
        # Env-specific Zitadel organizer-console project (the organizer server's
        # role-claim check).
        # Value is a Pulumi output (organizerConsoleProjectId); set per overlay.
        - name: ORGANIZER_CONSOLE_PROJECT_ID
          value: REPLACE_ME_IN_OVERLAY
        # Authenticate to Cloud SQL as this workload's OWN IAM DB user, not
        # fan-api's. An explicit container `env` entry overrides the value
        # supplied by `envFrom` (fan-api-config, which carries the fan-api
        # DATABASE_USER) — Kubernetes gives precedence to `env` over `envFrom`
        # for the same key. Set per overlay to the admin-console-api IAM user.
        - name: DATABASE_USER
          value: REPLACE_ME_IN_OVERLAY
        # A pool of two: fan-api-config (envFrom) carries fan-api's share of
        # the connection budget, and `env` takes precedence over it (OpenSpec
        # change introduce-durable-workflows, design "Connections"). The DBOS
        # client it starts workflows through holds one connection for its
        # notification listener (publish-events-through-outbox), so a pool of
        # one leaves the server none.
        - name: DATABASE_MAX_OPEN_CONNS
          value: "2"
        - name: DATABASE_MAX_IDLE_CONNS
          value: "1"
        # Stripe secret key for the admin OrderService.Refund. Optional so the
        # Pod still starts (with the Noop payment ports, Refund → Unavailable)
        # in an environment where the GSM secret is not provisioned.
        - name: STRIPE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: admin-console-api-stripe-secret
              key: STRIPE_SECRET_KEY
              optional: true
        envFrom:
        # Config: admin borrows fan-api-config (successor to the deleted
        # server-config; identical content, DATABASE_USER overridden above).
        # Secret: the namespace-shared backend-secrets (relocated ExternalSecret).
        - configMapRef:
            name: fan-api-config
        - secretRef:
            name: backend-secrets
        # Stripe credentials, for OrderService.Refund. Required: the backend refuses to
        # start outside local without them.
        - secretRef:
            name: api-stripe-secrets
        lifecycle:
          # Keeps serving while the load balancer drops this Pod's endpoint:
          # 60 s drain + 60 s estimated drain latency.
          preStop:
            sleep:
              seconds: 120
        readinessProbe:
          grpc:
            port: 8090
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        # DI waits up to 5 minutes for the database before the server (and its
        # health service) starts, so liveness is held off until the process
        # answers: 36 x 10 s = 6 minutes.
        startupProbe:
          grpc:
            port: 8090
            service: liveness
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 36
        # The `liveness` health service reports only whether the process can
        # answer; readiness (default service) reports the database.
        livenessProbe:
          grpc:
            port: 8090
            service: liveness
          initialDelaySeconds: 10
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
            ephemeral-storage: 100Mi
          limits:
            cpu: 200m
            memory: 256Mi
            ephemeral-storage: 100Mi
