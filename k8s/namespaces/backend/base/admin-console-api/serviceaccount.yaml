apiVersion: v1
kind: ServiceAccount
metadata:
  name: admin-console-api
  annotations:
    # Requires the GSA created by Pulumi: admin-console-api@<project-id>.iam.gserviceaccount.com
    # Overlays patch this annotation with the env-specific GSA (see overlays/{dev,prod}).
    iam.gke.io/gcp-service-account: REPLACE_ME_IN_OVERLAY
