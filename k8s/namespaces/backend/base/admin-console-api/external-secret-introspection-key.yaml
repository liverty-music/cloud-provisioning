apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  # The key of the admin console API's ZITADEL API application (private-key JWT). It only
  # lets that API ask ZITADEL whether a token issued for its own project is
  # active (introspection); it can neither read nor change identities.
  # Mounted only on this API. GSM grants accessor on it to the ESO SA alone.
  # OpenSpec change verify-sign-in-tokens-with-introspection.
  name: admin-console-api-introspection-key
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: google-secret-manager
    kind: ClusterSecretStore
  target:
    name: admin-console-api-introspection-key
    creationPolicy: Owner
  data:
  - secretKey: zitadel-introspection-key-for-admin-console-api.json
    remoteRef:
      key: zitadel-introspection-key-for-admin-console-api
