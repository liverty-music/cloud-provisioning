apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  # Stripe secret key for the admin OrderService.Refund (and any other admin
  # path that moves money through the payment provider). Without it the
  # backend falls back to the Noop payment ports and Refund returns
  # Unavailable. Kept in its OWN ExternalSecret, optional for the Deployment,
  # so an environment without the `stripe-secret-key` GSM key still starts.
  name: admin-console-api-stripe-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: google-secret-manager
    kind: ClusterSecretStore
  target:
    name: admin-console-api-stripe-secret
    creationPolicy: Owner
  data:
  - secretKey: STRIPE_SECRET_KEY
    remoteRef:
      key: stripe-secret-key
