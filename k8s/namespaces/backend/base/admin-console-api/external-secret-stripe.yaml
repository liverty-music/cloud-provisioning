apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  # Stripe secret key for the admin OrderService.Refund (and any other admin
  # path that moves money through the payment provider). Without it the
  # backend falls back to the Noop payment ports and Refund returns
  # Unavailable. Kept in its OWN ExternalSecret, not in
  # admin-console-api-secrets: ESO fails a whole bundle when one referenced
  # GSM key is absent, and an environment without `stripe-secret-key` must not
  # strand the organizer-provisioner key. The Deployment reads it with
  # `optional: true` for the same reason.
  name: admin-console-api-stripe-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: google-secret-manager
    kind: ClusterSecretStore
  target:
    name: admin-console-api-stripe-secret
    creationPolicy: Owner
  data:
  - secretKey: STRIPE_SECRET_KEY
    remoteRef:
      key: stripe-secret-key
