apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  # admin-console-api-secrets (unify-workload-naming): successor to
  # admin-console-secrets, renamed to match the admin-console-api workload
  # (audience-tier). Created alongside the old ExternalSecret (create-new); the
  # deployment is repointed to this Secret at cutover, then the old one is
  # deleted. Same GSM source, so both Secrets carry identical data during the
  # overlap — no key rotation.
  name: admin-console-api-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: google-secret-manager
    kind: ClusterSecretStore
  target:
    # Dedicated Secret — the powerful organizer-provisioner key is kept OUT of
    # the shared backend-secrets. Only admin-console-api mounts this Secret.
    name: admin-console-api-secrets
    creationPolicy: Owner
  data:
  - secretKey: zitadel-machine-key-for-organizer-provisioner.json
    remoteRef:
      key: zitadel-machine-key-for-organizer-provisioner
