apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- serviceaccount.yaml
- deployment.yaml
- service.yaml
- health-check-policy.yaml
- httproute.yaml
- external-secret.yaml
# create-new (unify-workload-naming): admin-console-api-secrets alongside the old
# admin-console-secrets; the deployment cuts over to it, then external-secret.yaml
# is removed.
- external-secret-api.yaml

configurations:
- kustomizeconfig.yaml

# Sub-base-scoped `app: admin-console-api` label (with selector). This is the
# selector-isolation boundary: the label only applies to resources in THIS
# sub-base, so admin-console-api Pods/Service never inherit the `server/`
# sub-base's `app: server`, and vice versa.
labels:
- includeSelectors: true
  pairs:
    app: admin-console-api

# Shared API-server binary image (unify-workload-naming): admin-console-api pulls
# the audience-neutral `backend/api`, the same image as fan-api (one Go binary,
# differentiated by runtime config) — so the two API workloads never drift.
# Successor to `backend/server`. The bare container `image: server` is the match
# key rewritten here to the dev-AR form; the prod overlay last-write-wins to the
# prod AR + semver pin on backend/api.
images:
- name: server
  newName: asia-northeast2-docker.pkg.dev/liverty-music-dev/backend/api
  newTag: latest
