apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- serviceaccount.yaml
- deployment.yaml
- service.yaml
- health-check-policy.yaml
- httproute.yaml
- external-secret.yaml

configurations:
- kustomizeconfig.yaml

# Sub-base-scoped `app: admin-console-api` label (with selector). This is the
# selector-isolation boundary: the label only applies to resources in THIS
# sub-base, so admin-console-api Pods/Service never inherit the `server/`
# sub-base's `app: server`, and vice versa.
labels:
- includeSelectors: true
  pairs:
    app: admin-console-api

# Shared API-server binary image (unify-workload-naming). fan-api and
# admin-console-api are the SAME Go binary differentiated only by runtime config,
# so they pull ONE canonical image — `backend/fan-api`, the successor to the
# retired `backend/server`. Consolidating onto a single image (rather than a
# per-audience copy) eliminates version drift between the two API workloads and
# mirrors the event-consumer/`backend/consumer` reuse decision: image == binary,
# workload name == deployment identity, they need not match. The bare container
# `image: server` is the match key rewritten here to the dev-AR form; the prod
# overlay last-write-wins to the prod AR + semver pin on `backend/fan-api`.
images:
- name: server
  newName: asia-northeast2-docker.pkg.dev/liverty-music-dev/backend/fan-api
  newTag: latest
