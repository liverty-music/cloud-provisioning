apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  # Dedicated Secret for event-consumer only. It carries the
  # fan-passkey-recovery machine key (ORG_OWNER on the product org, the only org
  # role with `user.passkey.write`), which issues passkey registration links for
  # fans who lost their passkeys. Kept OUT of the shared backend-secrets (which
  # cronjobs and the API workloads also read) and never mounted on the
  # internet-facing fan-api. GSM grants accessor on it to the ESO SA alone. See
  # OpenSpec change `fan-passkey-recovery-and-management`, design D2.
  name: event-consumer-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: google-secret-manager
    kind: ClusterSecretStore
  target:
    name: event-consumer-secrets
    creationPolicy: Owner
  data:
  - secretKey: zitadel-machine-key-for-fan-passkey-recovery.json
    remoteRef:
      key: zitadel-machine-key-for-fan-passkey-recovery
