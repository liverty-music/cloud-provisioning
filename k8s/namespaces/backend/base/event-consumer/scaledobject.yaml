      activationLagThreshold: "0"
  # POISON stream
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: "nats.nats.svc.cluster.local:8222"
      account: "$G"
      stream: "POISON"
      consumer: "log-poison"
      lagThreshold: "1"
      activationLagThreshold: "0"
