apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: event-consumer
spec:
  scaleTargetRef:
    name: event-consumer
  minReplicaCount: 0
  maxReplicaCount: 3
  cooldownPeriod: 300
  pollingInterval: 30
  # Triggers reference the behavior-named JetStream durables the consumer app
  # creates (durable == deliver group == handler behavior name; see the backend
  # messaging.behaviorTable). Each trigger's `consumer` MUST exactly match a live
  # durable, else the HPA reports `<unknown>`. Three subjects have two behaviors
  # each (ARTIST.created, ARTIST.followed, USER.created) → two durables/triggers
  # (fan-out). Prod pins min=max=1 so these are inert there, but the base stays
  # complete for dev.
  triggers:
  # CONCERT stream
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: "nats.nats.svc.cluster.local:8222"
      account: "$G"
      stream: "CONCERT"
      consumer: "notify-concert"
      lagThreshold: "10"
      activationLagThreshold: "0"
  # ARTIST stream — ARTIST.created fans out to two behaviors.
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: "nats.nats.svc.cluster.local:8222"
      account: "$G"
      stream: "ARTIST"
      consumer: "resolve-artist-name"
      lagThreshold: "1"
      activationLagThreshold: "0"
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: "nats.nats.svc.cluster.local:8222"
      account: "$G"
      stream: "ARTIST"
      consumer: "resolve-artist-image"
      lagThreshold: "1"
      activationLagThreshold: "0"
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: "nats.nats.svc.cluster.local:8222"
      account: "$G"
      stream: "ARTIST"
      consumer: "track-artist-followed"
      lagThreshold: "1"
      activationLagThreshold: "0"
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: "nats.nats.svc.cluster.local:8222"
      account: "$G"
      stream: "ARTIST"
      consumer: "search-first-followed-artist"
      lagThreshold: "1"
      activationLagThreshold: "0"
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: "nats.nats.svc.cluster.local:8222"
      account: "$G"
      stream: "ARTIST"
      consumer: "track-artist-unfollowed"
      lagThreshold: "1"
      activationLagThreshold: "0"
  # Product analytics (expand-product-analytics): hype changes.
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: "nats.nats.svc.cluster.local:8222"
      account: "$G"
      stream: "ARTIST"
      consumer: "track-artist-hype-changed"
      lagThreshold: "1"
      activationLagThreshold: "0"
  # USER stream — USER.created fans out to two behaviors; login is now a USER
  # event.
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: "nats.nats.svc.cluster.local:8222"
      account: "$G"
      stream: "USER"
      consumer: "verify-user-email"
      lagThreshold: "1"
      activationLagThreshold: "0"
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: "nats.nats.svc.cluster.local:8222"
      account: "$G"
      stream: "USER"
      consumer: "track-user-created"
      lagThreshold: "1"
      activationLagThreshold: "0"
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: "nats.nats.svc.cluster.local:8222"
      account: "$G"
      stream: "USER"
      consumer: "track-user-logged-in"
      lagThreshold: "1"
      activationLagThreshold: "0"
  # USER.passkey_added and USER.passkey_removed (OpenSpec change
  # publish-events-through-outbox): the passkey change email of each announced
  # Passkey.
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: "nats.nats.svc.cluster.local:8222"
      account: "$G"
      stream: "USER"
      consumer: "notify-passkey-added"
      lagThreshold: "1"
      activationLagThreshold: "0"
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: "nats.nats.svc.cluster.local:8222"
      account: "$G"
      stream: "USER"
      consumer: "notify-passkey-removed"
      lagThreshold: "1"
      activationLagThreshold: "0"
  # NOTIFICATION stream
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: "nats.nats.svc.cluster.local:8222"
      account: "$G"
      stream: "NOTIFICATION"
      consumer: "track-notification-subscribed"
      lagThreshold: "1"
      activationLagThreshold: "0"
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: "nats.nats.svc.cluster.local:8222"
      account: "$G"
      stream: "NOTIFICATION"
      consumer: "track-notification-unsubscribed"
      lagThreshold: "1"
      activationLagThreshold: "0"
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: "nats.nats.svc.cluster.local:8222"
      account: "$G"
      stream: "NOTIFICATION"
      consumer: "track-notification-delivered"
      lagThreshold: "1"
      activationLagThreshold: "0"
  # ORDER stream: purchase confirmation and the ticket journey update
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: "nats.nats.svc.cluster.local:8222"
      account: "$G"
      stream: "ORDER"
      consumer: "send-order-confirmation"
      lagThreshold: "1"
      activationLagThreshold: "0"
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: "nats.nats.svc.cluster.local:8222"
      account: "$G"
      stream: "ORDER"
      consumer: "mark-ticket-journey-paid"
      lagThreshold: "1"
      activationLagThreshold: "0"
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: "nats.nats.svc.cluster.local:8222"
      account: "$G"
      stream: "ORDER"
      consumer: "send-resale-sold"
      lagThreshold: "1"
      activationLagThreshold: "0"
  # Product analytics (expand-product-analytics): order lifecycle events.
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: "nats.nats.svc.cluster.local:8222"
      account: "$G"
      stream: "ORDER"
      consumer: "track-order-paid"
      lagThreshold: "1"
      activationLagThreshold: "0"
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: "nats.nats.svc.cluster.local:8222"
      account: "$G"
      stream: "ORDER"
      consumer: "track-lottery-entry-drawn"
      lagThreshold: "1"
      activationLagThreshold: "0"
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: "nats.nats.svc.cluster.local:8222"
      account: "$G"
      stream: "ORDER"
      consumer: "track-checkout-expired"
      lagThreshold: "1"
      activationLagThreshold: "0"
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: "nats.nats.svc.cluster.local:8222"
      account: "$G"
      stream: "ORDER"
      consumer: "track-ticket-admitted"
      lagThreshold: "1"
      activationLagThreshold: "0"
  # TICKET_JOURNEY / TICKET_EMAIL streams
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: "nats.nats.svc.cluster.local:8222"
      account: "$G"
      stream: "TICKET_JOURNEY"
      consumer: "track-ticket-journey"
      lagThreshold: "1"
      activationLagThreshold: "0"
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: "nats.nats.svc.cluster.local:8222"
      account: "$G"
      stream: "TICKET_EMAIL"
      consumer: "track-ticket-email"
      lagThreshold: "1"
      activationLagThreshold: "0"
  # SALES_PHASE stream — the announcement of a discovered sale.
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: "nats.nats.svc.cluster.local:8222"
      account: "$G"
      stream: "SALES_PHASE"
      consumer: "notify-sales-phase"
      lagThreshold: "1"
      activationLagThreshold: "0"
  # POISON stream — dead-letter logging.
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: "nats.nats.svc.cluster.local:8222"
      account: "$G"
      stream: "POISON"
      consumer: "log-poison"
      lagThreshold: "1"
      activationLagThreshold: "0"
  # ORGANIZER stream — organizer lifecycle analytics (organizer.created,
  # organizer.artist.associated). See backend messaging.behaviorTable.
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: "nats.nats.svc.cluster.local:8222"
      account: "$G"
      stream: "ORGANIZER"
      consumer: "analytics-organizer-created"
      lagThreshold: "1"
      activationLagThreshold: "0"
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: "nats.nats.svc.cluster.local:8222"
      account: "$G"
      stream: "ORGANIZER"
      consumer: "analytics-organizer-artist-associated"
      lagThreshold: "1"
      activationLagThreshold: "0"
