apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: event-consumer
spec:
  scaleTargetRef:
    name: event-consumer
  minReplicaCount: 0
  maxReplicaCount: 3
  cooldownPeriod: 300
  pollingInterval: 30
  # One trigger per behavior-named JetStream durable the event consumer binds
  # (durable == behavior name; see the backend behaviorTable in
  # internal/di/consumer.go), on the stream named after the entity. Each
  # trigger's `consumer` MUST exactly match a durable that NACK declares in
  # k8s/namespaces/nats/base/jetstream/, else the HPA reports `<unknown>`. A
  # subject with several behaviors has one durable and one trigger per behavior
  # (fan-out). Prod pins min=max=1 so these are inert there, but the base stays
  # complete for dev.
  triggers:
  # CONCERT stream
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: "nats.nats.svc.cluster.local:8222"
      account: "$G"
      stream: "CONCERT"
      consumer: "notify-concert"
      lagThreshold: "10"
      activationLagThreshold: "0"
  # EVENT stream
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: "nats.nats.svc.cluster.local:8222"
      account: "$G"
      stream: "EVENT"
      consumer: "send-event-cancelled"
      lagThreshold: "1"
      activationLagThreshold: "0"
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: "nats.nats.svc.cluster.local:8222"
      account: "$G"
      stream: "EVENT"
      consumer: "end-lottery-entries-of-cancelled-event"
      lagThreshold: "1"
      activationLagThreshold: "0"
  # ARTIST stream
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: "nats.nats.svc.cluster.local:8222"
      account: "$G"
      stream: "ARTIST"
      consumer: "refresh-artist"
      lagThreshold: "1"
      activationLagThreshold: "0"
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: "nats.nats.svc.cluster.local:8222"
      account: "$G"
      stream: "ARTIST"
      consumer: "resolve-artist-image"
      lagThreshold: "1"
      activationLagThreshold: "0"
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: "nats.nats.svc.cluster.local:8222"
      account: "$G"
      stream: "ARTIST"
      consumer: "track-artist-represented"
      lagThreshold: "1"
      activationLagThreshold: "0"
  # FOLLOW stream
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: "nats.nats.svc.cluster.local:8222"
      account: "$G"
      stream: "FOLLOW"
      consumer: "search-first-followed-artist"
      lagThreshold: "1"
      activationLagThreshold: "0"
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: "nats.nats.svc.cluster.local:8222"
      account: "$G"
      stream: "FOLLOW"
      consumer: "track-follow-created"
      lagThreshold: "1"
      activationLagThreshold: "0"
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: "nats.nats.svc.cluster.local:8222"
      account: "$G"
      stream: "FOLLOW"
      consumer: "track-follow-removed"
      lagThreshold: "1"
      activationLagThreshold: "0"
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: "nats.nats.svc.cluster.local:8222"
      account: "$G"
      stream: "FOLLOW"
      consumer: "track-follow-hype-changed"
      lagThreshold: "1"
      activationLagThreshold: "0"
  # USER stream
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: "nats.nats.svc.cluster.local:8222"
      account: "$G"
      stream: "USER"
      consumer: "verify-user-email"
      lagThreshold: "1"
      activationLagThreshold: "0"
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: "nats.nats.svc.cluster.local:8222"
      account: "$G"
      stream: "USER"
      consumer: "track-user-created"
      lagThreshold: "1"
      activationLagThreshold: "0"
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: "nats.nats.svc.cluster.local:8222"
      account: "$G"
      stream: "USER"
      consumer: "track-user-signed-in"
      lagThreshold: "1"
      activationLagThreshold: "0"
  # PASSKEY stream
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: "nats.nats.svc.cluster.local:8222"
      account: "$G"
      stream: "PASSKEY"
      consumer: "notify-passkey-added"
      lagThreshold: "1"
      activationLagThreshold: "0"
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: "nats.nats.svc.cluster.local:8222"
      account: "$G"
      stream: "PASSKEY"
      consumer: "notify-passkey-removed"
      lagThreshold: "1"
      activationLagThreshold: "0"
  # PUSH_SUBSCRIPTION stream
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: "nats.nats.svc.cluster.local:8222"
      account: "$G"
      stream: "PUSH_SUBSCRIPTION"
      consumer: "track-push-subscription-subscribed"
      lagThreshold: "1"
      activationLagThreshold: "0"
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: "nats.nats.svc.cluster.local:8222"
      account: "$G"
      stream: "PUSH_SUBSCRIPTION"
      consumer: "track-push-subscription-unsubscribed"
      lagThreshold: "1"
      activationLagThreshold: "0"
  # TICKET_SALE stream
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: "nats.nats.svc.cluster.local:8222"
      account: "$G"
      stream: "TICKET_SALE"
      consumer: "notify-ticket-sale-discovered"
      lagThreshold: "1"
      activationLagThreshold: "0"
  # TICKET_JOURNEY stream
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: "nats.nats.svc.cluster.local:8222"
      account: "$G"
      stream: "TICKET_JOURNEY"
      consumer: "track-ticket-journey"
      lagThreshold: "1"
      activationLagThreshold: "0"
  # ORGANIZER stream
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: "nats.nats.svc.cluster.local:8222"
      account: "$G"
      stream: "ORGANIZER"
      consumer: "track-organizer-activated"
      lagThreshold: "1"
      activationLagThreshold: "0"
  # ORDER stream
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: "nats.nats.svc.cluster.local:8222"
      account: "$G"
      stream: "ORDER"
      consumer: "send-order-confirmation"
      lagThreshold: "1"
      activationLagThreshold: "0"
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: "nats.nats.svc.cluster.local:8222"
      account: "$G"
      stream: "ORDER"
      consumer: "mark-ticket-journey-paid"
      lagThreshold: "1"
      activationLagThreshold: "0"
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: "nats.nats.svc.cluster.local:8222"
      account: "$G"
      stream: "ORDER"
      consumer: "send-order-refunded"
      lagThreshold: "1"
      activationLagThreshold: "0"
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: "nats.nats.svc.cluster.local:8222"
      account: "$G"
      stream: "ORDER"
      consumer: "track-order-paid"
      lagThreshold: "1"
      activationLagThreshold: "0"
  # RESALE_LISTING stream
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: "nats.nats.svc.cluster.local:8222"
      account: "$G"
      stream: "RESALE_LISTING"
      consumer: "start-resale-refund"
      lagThreshold: "1"
      activationLagThreshold: "0"
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: "nats.nats.svc.cluster.local:8222"
      account: "$G"
      stream: "RESALE_LISTING"
      consumer: "send-resale-sold"
      lagThreshold: "1"
      activationLagThreshold: "0"
  # LOTTERY_ENTRY stream
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: "nats.nats.svc.cluster.local:8222"
      account: "$G"
      stream: "LOTTERY_ENTRY"
      consumer: "mark-ticket-journey-applied"
      lagThreshold: "1"
      activationLagThreshold: "0"
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: "nats.nats.svc.cluster.local:8222"
      account: "$G"
      stream: "LOTTERY_ENTRY"
      consumer: "start-lottery-entry-workflow"
      lagThreshold: "1"
      activationLagThreshold: "0"
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: "nats.nats.svc.cluster.local:8222"
      account: "$G"
      stream: "LOTTERY_ENTRY"
      consumer: "track-lottery-entry-result"
      lagThreshold: "1"
      activationLagThreshold: "0"
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: "nats.nats.svc.cluster.local:8222"
      account: "$G"
      stream: "LOTTERY_ENTRY"
      consumer: "send-lottery-loss"
      lagThreshold: "1"
      activationLagThreshold: "0"
  # RESALE_ENTRY stream
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: "nats.nats.svc.cluster.local:8222"
      account: "$G"
      stream: "RESALE_ENTRY"
      consumer: "start-resale-entry-workflow"
      lagThreshold: "1"
      activationLagThreshold: "0"
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: "nats.nats.svc.cluster.local:8222"
      account: "$G"
      stream: "RESALE_ENTRY"
      consumer: "send-resale-entry-ended"
      lagThreshold: "1"
      activationLagThreshold: "0"
  # CHECKOUT stream
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: "nats.nats.svc.cluster.local:8222"
      account: "$G"
      stream: "CHECKOUT"
      consumer: "start-checkout-expiry"
      lagThreshold: "1"
      activationLagThreshold: "0"
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: "nats.nats.svc.cluster.local:8222"
      account: "$G"
      stream: "CHECKOUT"
      consumer: "release-expired-checkout"
      lagThreshold: "1"
      activationLagThreshold: "0"
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: "nats.nats.svc.cluster.local:8222"
      account: "$G"
      stream: "CHECKOUT"
      consumer: "track-checkout-expired"
      lagThreshold: "1"
      activationLagThreshold: "0"
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: "nats.nats.svc.cluster.local:8222"
      account: "$G"
      stream: "CHECKOUT"
      consumer: "release-released-checkout"
      lagThreshold: "1"
      activationLagThreshold: "0"
  # TICKET stream
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: "nats.nats.svc.cluster.local:8222"
      account: "$G"
      stream: "TICKET"
      consumer: "track-ticket-admitted"
