apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- serviceaccount.yaml
# Shared `backend-secrets` Secret (ESO), relocated out of the deleted `server`
# workload because consumer + cronjobs + admin-console-api all consume it.
- backend-secrets-external-secret.yaml
- api-stripe-external-secret.yaml
# fan-api: the fan-facing backend workload (unify-workload-naming), successor to
# the deleted `server` workload. Owns api.liverty-music.app via fan-api-route.
- fan-api
- admin-console-api
- organizer-console-api
- reception-api
- cronjob/concert-discovery
- cronjob/artist-image-sync
- cronjob/official-site-refresh
- cronjob/sales-phase-discovery
- cronjob/sales-reminders
- event-consumer
- series-image-consumer
# identity: the only workload holding the identity-provider keys (OpenSpec
# change identity-service).
- identity
# workflow-worker: the only process that runs durable workflows (OpenSpec
# change introduce-durable-workflows).
- workflow-worker
# Outside the identity sub-base on purpose: its `labels` transformer
# (includeSelectors) would rewrite the `from` podSelectors to `app: identity`.
- identity-networkpolicy.yaml

namespace: backend
