apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- serviceaccount.yaml
# Shared `backend-secrets` Secret (ESO), relocated out of the deleted `server`
# workload because consumer + cronjobs + admin-console-api all consume it.
- backend-secrets-external-secret.yaml
# fan-api: the fan-facing backend workload (unify-workload-naming), successor to
# the deleted `server` workload. Owns api.liverty-music.app via fan-api-route.
- fan-api
- admin-console-api
- organizer-console-api
- cronjob/concert-discovery
- cronjob/artist-image-sync
- cronjob/sales-phase-discovery
- cronjob/sales-reminders
- event-consumer

namespace: backend
