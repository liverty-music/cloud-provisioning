# Shared backend Secret (`backend-secrets`) synced from GCP Secret Manager by
# ESO. Consumed via envFrom / volume mounts by the shared-identity backend
# workloads — event-consumer and every cronjob (concert/artist-image/
# sales-phase/sales-reminders discovery), plus admin-console-api.
#
# unify-workload-naming: this ExternalSecret used to live inside the `server`
# workload, but the Secret it owns is shared, so it is relocated here to the
# namespace base — it must OUTLIVE the deleted `server` workload. fan-api has its
# own dedicated `fan-api-backend-secrets`.
#
# The resource name is intentionally kept as `server-backend-secrets` (only the
# file moved): ArgoCD tracks by name, so a same-name relocation is a no-op for
# the live `backend-secrets` Secret — no ESO ownership handoff, no churn for the
# 7 consumers (consumer + 5 cronjobs + admin). Renaming it to `backend-secrets`
# is a separate step that must sequence the Owner handoff to avoid a Secret gap.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: server-backend-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: google-secret-manager
    kind: ClusterSecretStore
  target:
    name: backend-secrets
    creationPolicy: Owner
  data:
  - secretKey: LASTFM_API_KEY
    remoteRef:
      key: lastfm-api-key
  - secretKey: VAPID_PRIVATE_KEY
    remoteRef:
      key: vapid-private-key
  - secretKey: FANARTTV_API_KEY
    remoteRef:
      key: fanarttv-api-key
  - secretKey: GCP_GEMINI_SEARCH_API_KEY
    remoteRef:
      key: gemini-search-api-key
  - secretKey: zitadel-machine-key-for-backend-app.json
    remoteRef:
      key: zitadel-machine-key-for-backend-app
  - secretKey: WEBHOOK_LOGIN_EVENT_SIGNING_KEY
    remoteRef:
      key: webhook-login-event-signing-key
  # Pocket Sign (mock/sandbox) Bearer token. admin/organizer-console-api share
  # the fan-api ConfigMap, which carries the POCKET_SIGN_* fields, so the backend's
  # both-or-neither PocketSignConfig.Validate() requires the token here too — else
  # those workloads fail startup with "POCKET_SIGN_TOKEN must be set when other
  # POCKET_SIGN_* fields are present". GSM `pocket-sign-token` is already
  # provisioned (fan-api uses it), so this entry is safe to add now. Harmless for
  # the other consumers (event-consumer/cronjobs) that carry no POCKET_SIGN_* config.
  - secretKey: POCKET_SIGN_TOKEN
    remoteRef:
      key: pocket-sign-token
