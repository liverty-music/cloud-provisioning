apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Purpose: External Secrets Operator syncs every application Secret from
# Secret Manager (ClusterSecretStore `google-secret-manager`). Only the
# controller runs; the webhook and cert-controller are off in base values.
#
# Prod ESO overlay. Env-divergent fields per design D2 / spec Requirement 3:
#   - eso-sa-patch.yaml swaps the GSA email to the prod project's
#     k8s-external-secrets SA (Workload Identity binding).
# Resource sizing / replica counts match dev exactly.

resources:
- ../../base
# GMP PodMonitoring for ESO controller status-condition metrics (CP#457
# detection hardening). Prod-only — dev has no ESO readiness alert.
- podmonitoring.yaml

patches:
- path: eso-sa-patch.yaml
  target:
    kind: ServiceAccount
    name: external-secrets

# No Spot nodeSelector in prod: the Deployments select no ComputeClass, so the
# cluster default class (k8s/cluster/overlays/prod/compute-class-default.yaml)
# places them on Spot with on-demand fallback and migrates them back
# (optimize-prod-gke-cost D1).

# Replicas=1 per design D8 (matches dev)
- target:
    kind: Deployment
    name: external-secrets
    namespace: external-secrets
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 1

# Right-sized CPU requests (match dev — design D2)
- target:
    kind: Deployment
    name: external-secrets
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: external-secrets
    spec:
      template:
        spec:
          containers:
          - name: external-secrets
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
                ephemeral-storage: 100Mi
              limits:
                cpu: 200m
                memory: 256Mi
                ephemeral-storage: 100Mi
