apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Prod ESO overlay. Env-divergent fields per design D2 / spec Requirement 3:
#   - eso-sa-patch.yaml swaps the GSA email to the prod project's
#     k8s-external-secrets SA (Workload Identity binding).
# Resource sizing / replica counts match dev exactly.

resources:
- ../../base
# GMP PodMonitoring for ESO controller status-condition metrics (CP#457
# detection hardening). Prod-only — dev has no ESO readiness alert.
- podmonitoring.yaml

patches:
- path: eso-sa-patch.yaml
  target:
    kind: ServiceAccount
    name: external-secrets

# Prefer Spot, fall back to on-demand (prod availability) for all ESO
# Deployments. ESO must stay up to keep cluster secrets in sync, so it must not
# be strandable on Spot-only: null the Spot node pin + add a Spot toleration and
# a soft prefer-Spot nodeAffinity, allowing on-demand fallback when Spot is
# unavailable.
- target:
    kind: Deployment
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: external-secrets
    spec:
      template:
        spec:
          nodeSelector:
            cloud.google.com/gke-spot: null
            cloud.google.com/compute-class: null
          tolerations:
            - key: cloud.google.com/gke-spot
              operator: Equal
              value: "true"
              effect: NoSchedule
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - key: cloud.google.com/gke-spot
                        operator: In
                        values:
                          - "true"

# Replicas=1 per design D8 (matches dev)
- target:
    kind: Deployment
    name: external-secrets
    namespace: external-secrets
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 1

# Right-sized CPU requests (match dev — design D2)
- target:
    kind: Deployment
    name: external-secrets
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: external-secrets
    spec:
      template:
        spec:
          containers:
          - name: external-secrets
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                cpu: 200m
                memory: 256Mi

- target:
    kind: Deployment
    name: external-secrets-cert-controller
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: external-secrets-cert-controller
    spec:
      template:
        spec:
          containers:
          - name: cert-controller
            resources:
              requests:
                cpu: 10m
                memory: 52Mi
              limits:
                cpu: 100m
                memory: 128Mi

- target:
    kind: Deployment
    name: external-secrets-webhook
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: external-secrets-webhook
    spec:
      template:
        spec:
          containers:
          - name: webhook
            resources:
              requests:
                cpu: 10m
                memory: 52Mi
              limits:
                cpu: 100m
                memory: 128Mi
