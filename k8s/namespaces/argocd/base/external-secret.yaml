apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-notifications-secret
spec:
  # The GitHub installation token below lives 60 minutes; refreshing every 30m
  # always lands a fresh one before the previous expires.
  refreshInterval: 30m
  secretStoreRef:
    name: google-secret-manager-argocd
    kind: ClusterSecretStore
  target:
    name: argocd-notifications-secret
    creationPolicy: Owner
  data:
  - secretKey: google-chat-webhook-url
    remoteRef:
      key: argocd-google-chat-webhook-url
  # Short-lived `liverty-music-cluster-bot` installation token for the
  # `incident-triage` webhook service (see github-access-token.yaml). ArgoCD
  # Notifications reads only this Secret, and it can have one owner, so the
  # token is merged in here rather than synced by a second ExternalSecret.
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: GithubAccessToken
        name: argocd-cluster-bot-token
    rewrite:
    - regexp:
        source: "^token$"
        target: "github-token"
