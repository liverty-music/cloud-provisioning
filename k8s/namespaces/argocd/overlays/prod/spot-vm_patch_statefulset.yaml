# Prefer Spot, fall back to on-demand (prod availability). See
# spot-vm_patch_deployment.yaml — StatefulSet variant (application-controller).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: any
spec:
  template:
    spec:
      nodeSelector:
        cloud.google.com/gke-spot: null
        cloud.google.com/compute-class: null
      tolerations:
        - key: cloud.google.com/gke-spot
          operator: Equal
          value: "true"
          effect: NoSchedule
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: cloud.google.com/gke-spot
                    operator: In
                    values:
                      - "true"
