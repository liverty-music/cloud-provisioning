apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: dev-apps
spec:
  namespace: argocd
  writeBackConfig:
    method: argocd
  applicationRefs:
  - namePattern: backend
    images:
    - alias: api
      # backend/api: the shared Connect-RPC image (unify-workload-naming),
      # successor to backend/server; pulled by fan-api + admin-console-api in dev.
      imageName: asia-northeast2-docker.pkg.dev/liverty-music-dev/backend/api:main
      commonUpdateSettings:
        updateStrategy: digest
        pullSecret: ext:/scripts/auth.sh
    - alias: consumer
      imageName: asia-northeast2-docker.pkg.dev/liverty-music-dev/backend/consumer:main
      commonUpdateSettings:
        updateStrategy: digest
        forceUpdate: true
        pullSecret: ext:/scripts/auth.sh
    - alias: concert-discovery
      imageName: asia-northeast2-docker.pkg.dev/liverty-music-dev/backend/concert-discovery:main
      commonUpdateSettings:
        updateStrategy: digest
        forceUpdate: true
        pullSecret: ext:/scripts/auth.sh
  - namePattern: frontend
    images:
    - alias: fan-web
      # frontend/fan-web: the consumer web bundle (unify-workload-naming),
      # successor to frontend/web-app.
      imageName: asia-northeast2-docker.pkg.dev/liverty-music-dev/frontend/fan-web:main
      commonUpdateSettings:
        updateStrategy: digest
        pullSecret: ext:/scripts/auth.sh
