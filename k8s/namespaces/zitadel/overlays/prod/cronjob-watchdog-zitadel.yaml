# Self-healing watchdog for the Zitadel projection-trigger wedge
# (zitadel/zitadel#10103, unfixed in v4.14.0).
#
# THE PROBLEM IT SOLVES: when Zitadel hits the in-process wedge, every
# auth-flow query that triggers-on-read a projection hangs (login 504),
# yet `/debug/healthz` and `/debug/ready` keep returning 200 — so the
# kubelet liveness/readiness probes never restart the pod. Recovery is a
# manual `kubectl rollout restart`. On 2026-06-23 prod login was down ~13
# min until a human restarted it.
#
# WHAT THIS DOES: every minute, probe `ProjectService/ListProjectRoles`
# via Connect/gRPC HTTP+JSON POST against the static `liverty-music`
# product project (id 373015520045170843 — always-present, Pulumi-managed).
# That method internally calls `SearchProjectRoles(…, shouldTriggerBulk=true,
# …)`, triggering `ProjectRoleProjection.Trigger(WithAwaitRunning())` — the
# exact projection that wedged on 2026-06-23 — as a pure read (no eventstore
# write, no OIDC auth-request accumulation). Healthy → 200 in well under a
# second. Wedged → the trigger-on-read blocks: the probe either times out
# (curl HTTP 000) OR returns a slow 5xx/2xx right at the server's internal
# ~10s deadline. BOTH manifestations are the wedge, so detection is
# TIME-BASED, not HTTP-code-based: a probe whose total time crosses
# WATCHDOG_SLOW_SEC (or times out) counts as a hang. (The prior 000-only
# check silently missed the slow-5xx variant — a 500 returning at ~9.9s,
# just under the old 10s max-time, was never counted, so real wedges went
# un-restarted.) If it hangs N/N times WHILE `/debug/healthz` is still 200
# (the precise wedge signature), restart `zitadel-api`. With 2 prod
# replicas the rolling restart is non-disruptive.
#
# PROBE HOST: public `auth.liverty-music.app` (the Zitadel API domain),
# consistent with the healthz precondition URL. This exercises the full
# gateway path (Cloud LB → Envoy → Zitadel) for realistic hang detection.
# The healthz precondition guards against gateway/DNS outages that would
# also cause the probe to hang but are not the in-process wedge.
#
# CREDENTIAL: a dedicated least-privilege machine-user PAT
# (`watchdog-probe`, `PROJECT_OWNER_VIEWER` on the product project only).
# Synced from GSM `zitadel-watchdog-probe-pat` via ExternalSecret into
# K8s Secret `zitadel-watchdog-probe-pat` in this namespace. Fail-safe:
# an invalid/expired PAT returns 401 fast, which the watchdog treats as
# "healthy" (no restart), and logs "watchdog credential invalid" so the
# loss of detection is discoverable.
#
# NOTE: unlike the prior authorize probe, this probe creates ZERO
# OIDC auth requests. The ~1440/day eventstore accumulation is eliminated.
#
# Annotated `liverty-music.app/temporary` for cleanup once upstream
# zitadel#10103 is fixed and pinned.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: zitadel-wedge-watchdog
  annotations:
    liverty-music.app/temporary: "until-upstream-zitadel-10103-fix"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zitadel-wedge-watchdog
  annotations:
    liverty-music.app/temporary: "until-upstream-zitadel-10103-fix"
# Minimum privilege: only get/patch the specific `zitadel-api` Deployment
# (`patch` is what `kubectl rollout restart` issues). Nothing else.
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  resourceNames: ["zitadel-api"]
  verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zitadel-wedge-watchdog
  annotations:
    liverty-music.app/temporary: "until-upstream-zitadel-10103-fix"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: zitadel-wedge-watchdog
subjects:
- kind: ServiceAccount
  name: zitadel-wedge-watchdog
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: zitadel-wedge-watchdog
  annotations:
    liverty-music.app/temporary: "until-upstream-zitadel-10103-fix"
  labels:
    app: zitadel
    component: self-healing
spec:
  # Every minute.
  schedule: "* * * * *"
  timeZone: "Etc/UTC"
  # A run takes up to ~47s worst case (healthz 5s + 3×12s probes + 2×3s
  # sleeps); never overlap the next minute's fire.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  # Don't backfill missed fires if the cluster was briefly offline.
  startingDeadlineSeconds: 120
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 300
      template:
        metadata:
          labels:
            app: zitadel
            component: self-healing
        spec:
          serviceAccountName: zitadel-wedge-watchdog
          restartPolicy: Never
          nodeSelector:
            cloud.google.com/gke-spot: "true"
          containers:
          - name: watchdog
            # Needs BOTH `curl` (probe) and `kubectl` (restart).
            # `alpine/k8s` bundles both; :1.32.x matches the cluster minor.
            image: alpine/k8s:1.32.3
            env:
            # ACTIVE: on the wedge signature (N/N ListProjectRoles hangs while
            # healthz=200) the watchdog runs `rollout restart`. Verified in
            # DRY-RUN first against live prod: probe authenticates (200, not
            # 401) and zero auth-request writes accumulate. Set back to "true"
            # to return to observe-only.
            - name: WATCHDOG_DRY_RUN
              value: "false"
            - name: HOME
              value: /tmp
            - name: WATCHDOG_HEALTHZ_URL
              value: "https://auth.liverty-music.app/debug/healthz"
            # Connect/gRPC HTTP+JSON endpoint for the read-only probe.
            # Served by Zitadel at the auth domain. See proposal.md D1.
            - name: WATCHDOG_PROBE_URL
              value: "https://auth.liverty-music.app/zitadel.project.v2.ProjectService/ListProjectRoles"
            # Static ID of the `liverty-music` product project (Pulumi-managed,
            # always-present). Pinned from `pulumi stack output` on the prod stack.
            # Re-verify on Zitadel major upgrades or if the project is reprovisioned.
            - name: WATCHDOG_PROJECT_ID
              value: "373015520045170843"
            # PAT file path — mounted from zitadel-watchdog-probe-pat Secret below.
            - name: WATCHDOG_PAT_FILE
              value: /var/run/watchdog/token
            # Slow-response threshold (whole seconds). A probe whose total
            # time is >= this is treated as a hang even if it eventually
            # returns an HTTP status. Healthy ListProjectRoles is <1s; the
            # wedge blocks on the projection trigger until the server's
            # internal ~10s deadline. 8s cleanly separates the two.
            - name: WATCHDOG_SLOW_SEC
              value: "8"
            command: ["/bin/sh", "-c"]
            args:
            - |
              set -u

              # Guard: only the wedge signature warrants a restart. The
              # wedge keeps core health green while auth-flow hangs. If
              # healthz is NOT 200, the fault is something else (gateway/
              # DNS/pod-down) that a restart won't fix — bail out.
              hz=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$WATCHDOG_HEALTHZ_URL" 2>/dev/null || echo 000)
              if [ "$hz" != "200" ]; then
                echo "healthz=$hz (not 200): not the wedge signature, skipping."
                exit 0
              fi

              # Read PAT from mounted secret file.
              if [ ! -f "$WATCHDOG_PAT_FILE" ]; then
                echo "watchdog credential invalid: PAT file $WATCHDOG_PAT_FILE not found."
                exit 0
              fi
              pat=$(cat "$WATCHDOG_PAT_FILE")

              # Probe `ProjectService/ListProjectRoles` 3× ~3s apart.
              # This method calls SearchProjectRoles(shouldTriggerBulk=true),
              # triggering ProjectRoleProjection — the wedged projection.
              #
              # Detection is TIME-BASED. The wedge blocks the trigger-on-read
              # and surfaces two ways depending on the race with the server's
              # internal deadline:
              #   * curl times out first        → http_code=000
              #   * server errors just in time  → slow 5xx (or even a slow 2xx)
              #     returned at ~9-10s
              # Either way the probe's total time crosses WATCHDOG_SLOW_SEC, so
              # a hang = (http_code=000 OR time_total >= WATCHDOG_SLOW_SEC).
              # A fast response (healthy <1s, or a fast transient error) is NOT
              # a hang — the fail-safe against restarting on unrelated blips.
              # --max-time 12 (> the ~10s server deadline) lets a slow error be
              # captured WITH its timing instead of racing to a bare 000.
              # 401/403 = credential invalid (fail-safe: no restart).
              hangs=0
              i=1
              while [ "$i" -le 3 ]; do
                out=$(curl -s -o /dev/null -w '%{http_code} %{time_total}' \
                  --max-time 12 \
                  -X POST "$WATCHDOG_PROBE_URL" \
                  -H "Authorization: Bearer $pat" \
                  -H "Content-Type: application/json" \
                  -d "{\"projectId\":\"$WATCHDOG_PROJECT_ID\"}" \
                  2>/dev/null)
                [ -z "$out" ] && out="000 12.000"
                code=${out%% *}
                ttime=${out##* }
                # Whole-seconds part of time_total for POSIX integer compare.
                tsec=${ttime%%.*}
                [ -z "$tsec" ] && tsec=0
                echo "probe $i/3: ListProjectRoles http_code=$code time=${ttime}s"
                if [ "$code" = "401" ] || [ "$code" = "403" ]; then
                  echo "watchdog credential invalid: probe returned $code — no action (detection degraded)."
                  exit 0
                fi
                if [ "$code" = "000" ] || [ "$tsec" -ge "$WATCHDOG_SLOW_SEC" ]; then
                  echo "  → hang (code=$code, ${ttime}s >= ${WATCHDOG_SLOW_SEC}s threshold or timeout)"
                  hangs=$((hangs + 1))
                fi
                if [ "$i" -lt 3 ]; then
                  sleep 3
                fi
                i=$((i + 1))
              done

              if [ "$hangs" -lt 3 ]; then
                echo "healthy: $hangs/3 probes hung — no action."
                exit 0
              fi

              echo "WEDGE DETECTED: $hangs/3 ListProjectRoles probes hung while healthz=200."
              if [ "${WATCHDOG_DRY_RUN:-true}" = "true" ]; then
                echo "WATCHDOG_DRY_RUN=true — would run: kubectl rollout restart deployment/zitadel-api (skipped)."
                exit 0
              fi
              echo "restarting deployment/zitadel-api ..."
              kubectl rollout restart deployment/zitadel-api
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                cpu: 200m
                memory: 128Mi
            securityContext:
              runAsNonRoot: true
              runAsUser: 65532
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              readOnlyRootFilesystem: true
            volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: watchdog-pat
              mountPath: /var/run/watchdog
              readOnly: true
          volumes:
          # Writable scratch for kubectl's discovery cache ($HOME=/tmp)
          # under readOnlyRootFilesystem.
          - name: tmp
            emptyDir: {}
          # PAT for the watchdog probe bearer token.
          # Synced from GSM `zitadel-watchdog-probe-pat` by ExternalSecret.
          - name: watchdog-pat
            secret:
              secretName: zitadel-watchdog-probe-pat
              items:
              - key: token
                path: token
