# Prefer Spot, fall back to on-demand (prod availability). Zitadel is auth, yet
# both zitadel-api replicas were pinned Spot-only (via the Helm base's
# nodeSelector), so a single Spot-node loss = login outage with no reschedule.
# Null the Spot node pin (set in base values.yaml) + add a Spot toleration and a
# soft prefer-Spot nodeAffinity, allowing on-demand fallback. Applies to
# zitadel-api + zitadel-api-login.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: any
spec:
  template:
    spec:
      nodeSelector:
        cloud.google.com/gke-spot: null
        cloud.google.com/compute-class: null
      tolerations:
        - key: cloud.google.com/gke-spot
          operator: Equal
          value: "true"
          effect: NoSchedule
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: cloud.google.com/gke-spot
                    operator: In
                    values:
                      - "true"
