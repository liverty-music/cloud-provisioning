# Adds a per-pod liveness probe sidecar to `zitadel-api` to replace the
# cluster-wide CronJob watchdog (cronjob-watchdog-zitadel.yaml).
#
# WHY PER-POD SIDECAR INSTEAD OF CRONJOB:
# The CronJob issues `kubectl rollout restart`, restarting BOTH replicas
# simultaneously → ~90s window where the service is fully unavailable.
# Because both replicas re-wedge in lockstep (~3 min after each restart),
# this produces repeated complete outages. A per-pod liveness probe restarts
# each replica independently: only the wedged pod is restarted while the
# other keeps serving. PDB minAvailable:1 enforces at least one Ready replica
# throughout. This naturally desynchronises the replicas so there is always
# one in its healthy post-startup window.
#
# HOW THE PROBE WORKS:
# The `watchdog-probe` sidecar sleeps indefinitely while its exec liveness
# probe fires every 20s. The probe runs the same time-based ListProjectRoles
# check used by the former CronJob: a hang is counted when http_code=000 OR
# time_total >= WATCHDOG_SLOW_SEC (8s). After 3 consecutive hangs the kubelet
# kills and restarts this pod. A fast 401/403 is treated as "not wedged"
# (fail-safe against restarting on expired PAT). A fast transient error is
# also not counted (time below threshold).
#
# initialDelaySeconds:60 gives the pod time to fully start before probing;
# the wedge is an in-process deadlock that only occurs after the pod is
# handling traffic, not at startup.
#
# Annotated `liverty-music.app/temporary` for cleanup once upstream
# zitadel/zitadel#10103 is fixed and pinned.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zitadel-api
  annotations:
    liverty-music.app/temporary: "until-upstream-zitadel-10103-fix"
spec:
  template:
    spec:
      containers:
      - name: watchdog-probe
        # alpine/curl: minimal image with curl; no kubectl needed (kubelet
        # handles the restart when the liveness probe returns non-zero).
        image: alpine/curl:8.21.0
        command: ["sleep", "infinity"]
        env:
        - name: WATCHDOG_HEALTHZ_URL
          value: "https://auth.liverty-music.app/debug/healthz"
        - name: WATCHDOG_PROBE_URL
          value: "https://auth.liverty-music.app/zitadel.project.v2.ProjectService/ListProjectRoles"
        - name: WATCHDOG_PROJECT_ID
          value: "373015520045170843"
        - name: WATCHDOG_PAT_FILE
          value: /var/run/watchdog/token
        # Slow-response threshold in whole seconds. Healthy ListProjectRoles
        # is <1s; the wedge blocks until the server's ~10s internal deadline.
        # 8s cleanly separates healthy from wedged.
        - name: WATCHDOG_SLOW_SEC
          value: "8"
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - |
              set -u
              # Guard: only restart on the wedge signature (core healthy +
              # trigger-path hung). Gateway/DNS/pod-down faults are NOT the wedge.
              hz=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 \
                "$WATCHDOG_HEALTHZ_URL" 2>/dev/null || echo 000)
              if [ "$hz" != "200" ]; then
                echo "healthz=$hz (not 200): not the wedge signature, skipping."
                exit 0
              fi
              if [ ! -f "$WATCHDOG_PAT_FILE" ]; then
                echo "watchdog credential invalid: PAT file not found."
                exit 0
              fi
              pat=$(cat "$WATCHDOG_PAT_FILE")
              # Single probe per liveness check (K8s runs periodSeconds=20 itself;
              # failureThreshold=3 requires 3 consecutive failures before restart).
              out=$(curl -s -o /dev/null -w '%{http_code} %{time_total}' \
                --max-time 12 \
                -X POST "$WATCHDOG_PROBE_URL" \
                -H "Authorization: Bearer $pat" \
                -H "Content-Type: application/json" \
                -d "{\"projectId\":\"$WATCHDOG_PROJECT_ID\"}" \
                2>/dev/null)
              [ -z "$out" ] && out="000 12.000"
              code=${out%% *}
              ttime=${out##* }
              tsec=${ttime%%.*}
              [ -z "$tsec" ] && tsec=0
              echo "probe: ListProjectRoles http_code=$code time=${ttime}s"
              if [ "$code" = "401" ] || [ "$code" = "403" ]; then
                echo "watchdog credential invalid: probe returned $code (no action)."
                exit 0
              fi
              if [ "$code" = "000" ] || [ "$tsec" -ge "$WATCHDOG_SLOW_SEC" ]; then
                echo "HANG DETECTED: code=$code ${ttime}s >= ${WATCHDOG_SLOW_SEC}s threshold"
                exit 1
              fi
              echo "healthy: ${ttime}s"
              exit 0
          initialDelaySeconds: 60
          periodSeconds: 20
          timeoutSeconds: 14
          failureThreshold: 3
          successThreshold: 1
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
          limits:
            cpu: 50m
            memory: 32Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: watchdog-pat
          mountPath: /var/run/watchdog
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: watchdog-pat
        secret:
          secretName: zitadel-watchdog-probe-pat
          items:
          - key: token
            path: token
      - name: tmp
        emptyDir: {}
