# Secret the Login V2 pod signs its session cookie with (Zitadel v4.19.2+;
# v4.19.5 also signs email/invite verification, passkey registration and IdP
# linking with it). Generated by Pulumi (`random.RandomString` in
# src/gcp/index.ts) and stored in the ESO-only GSM secret
# `zitadel-login-session-cookie-secret`; this mirrors it into the Secret named
# by `login.sessionCookieSecretName`, whose data key the chart requires to be
# literally `ZITADEL_SESSION_COOKIE_SECRET`.
#
# The Login UI reads the value as a comma-separated list: the first entry
# signs, every entry verifies. To rotate without signing users out, add a GSM
# version holding "new,old" and restart the Login UI; the chart adds no
# checksum for an external Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-login-session-cookie
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: google-secret-manager
    kind: ClusterSecretStore
  target:
    name: zitadel-login-session-cookie
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: ZITADEL_SESSION_COOKIE_SECRET
    remoteRef:
      key: zitadel-login-session-cookie-secret
