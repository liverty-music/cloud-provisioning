# X.509 keypair the Login V2 client authenticates to the Zitadel API with
# (Zitadel chart 10.x: SystemAPIUsers `login-client`, role IAM_LOGIN_CLIENT).
# Generated by Pulumi (`tls.PrivateKey` / `tls.SelfSignedCert` in
# src/gcp/index.ts) and stored in GSM as two ESO-only secrets; this mirrors
# them into the TLS Secret named by `login.loginServiceKeySecretName`.
#
# Why not let the chart generate it: the chart builds the keypair with
# `lookup` + `genSelfSignedCert`, and `lookup` is always empty when ArgoCD
# renders via kustomize, so every render would mint a new key and roll the
# API and login pods — logins fail while old and new pods disagree. An
# externally owned Secret makes the chart skip both the Secret and its
# checksum annotation (chart 10.0.6+), so the render is stable.
#
# A rotated key reaches the pods only on restart; the chart adds no checksum
# for an external Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-login-service-key
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: google-secret-manager
    kind: ClusterSecretStore
  target:
    name: zitadel-login-service-key
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/tls
  data:
  - secretKey: tls.crt
    remoteRef:
      key: zitadel-login-service-key-crt
  - secretKey: tls.key
    remoteRef:
      key: zitadel-login-service-key-key
