apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Prod KEDA overlay. KEDA is a singleton controller with no env-divergent
# state. Resource sizing + spot label match dev exactly (design D2 / spec
# Requirement 3).
#
# Purpose: KEDA (operator, metrics apiserver, admission webhooks — 3 Pods)
# scales `media-consumer` between 0 and 1 replicas on its JetStream backlog and
# drives the `event-consumer` ScaledObject. Removing it would make
# media-consumer (100m / 256Mi) run around the clock, which costs more than
# the three KEDA Pods.

namespace: keda

helmCharts:
- name: keda
  repo: https://kedacore.github.io/charts
  version: 2.21.0
  releaseName: keda
  namespace: keda
  valuesFile: values.yaml

patches:
- target:
    kind: Deployment
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: keda
    spec:
      template:
        spec:
          nodeSelector:
            cloud.google.com/gke-spot: "true"
