# One controller replica: production has no users beyond the owner and one
# tester, and a second replica only adds a standby for leader election.
controller:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
      ephemeral-storage: 100Mi
    limits:
      cpu: 100m
      memory: 128Mi
      ephemeral-storage: 100Mi
