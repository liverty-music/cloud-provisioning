apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Prod Argo Rollouts overlay. There is no dev overlay: dev is stopped
# indefinitely and keeps plain Deployments.
#
# Purpose: the controller runs `fan-api` and `fan-web` as blueGreen Rollouts, so a
# release is served on the preview address and rolls out to fans only when the
# owner promotes it (OpenSpec change add-prod-preview-release, design D1).
# Removing it leaves the Rollout resources without a controller: the Deployments
# stay at 0 replicas and nothing is served.

namespace: argo-rollouts

resources:
- ../../base
