apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  annotations:
    # Trigger a rolling restart when organizer-console-web-runtime-config
    # ConfigMap changes. The ConfigMap is mounted as a single-file subPath volume
    # which kubelet does NOT live-update; explicit rollout via Reloader is the
    # contract. Scoped to this Deployment only, so an organizer config change
    # never restarts the consumer web or admin pod (and vice versa).
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  template:
    metadata:
      # Labels handled by kustomize labels transformer
    spec:
      containers:
      - name: caddy
        image: organizer-console-web
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        volumeMounts:
        - name: runtime-config
          mountPath: /srv/config.json
          subPath: config.json
          readOnly: true
      volumes:
      - name: runtime-config
        configMap:
          # ConfigMap provided by overlays/<env>/organizer-console-web-configmap.yaml
          # (same content as the old organizer-app-runtime-config). Distinct from
          # the consumer fan-web-runtime-config and admin-console-web-runtime-config
          # so the organizer pod gets the organizer client id without any
          # host-conditional config rewrite. It deliberately omits a fixed org id —
          # the tenant org is pinned per session by org-pinned entry.
          name: organizer-console-web-runtime-config
