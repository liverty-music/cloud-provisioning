apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  annotations:
    # Trigger a rolling restart when reception-web-runtime-config changes (a
    # single-file subPath mount, which kubelet does NOT live-update).
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  # Keeps the old Pod until the new one has been Ready for this long. The NEG
  # readiness gate does not wait for the load balancer in this cluster, so
  # without this the old Pod stops before the new endpoint passes the load
  # balancer's health check (about 19 s) and requests get 503 (OpenSpec change
  # add-prod-preview-release, D1 and D9; measured on fan-web). 45 s covers it.
  minReadySeconds: 45
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      # Labels handled by kustomize labels transformer
    spec:
      # Drain, per the GKE guidance (D9): preStop >= drainingTimeoutSec (30 s,
      # GCPBackendPolicy) + drain latency (GKE estimates one minute);
      # terminationGracePeriod >= preStop + shutdown time. 120 = 90 + 30.
      terminationGracePeriodSeconds: 120
      containers:
      - name: caddy
        image: reception-web
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
            ephemeral-storage: 100Mi
          limits:
            cpu: 200m
            memory: 128Mi
            ephemeral-storage: 100Mi
        lifecycle:
          # Keeps serving while the load balancer drops this Pod's endpoint.
          preStop:
            sleep:
              seconds: 90
        volumeMounts:
        - name: runtime-config
          mountPath: /srv/config.json
          subPath: config.json
          readOnly: true
      volumes:
      - name: runtime-config
        configMap:
          # Provided by overlays/<env>/reception-web-configmap.yaml: the
          # reception API base URL only. The reception app has no sign-in, so
          # it carries no OIDC client id.
          name: reception-web-runtime-config
