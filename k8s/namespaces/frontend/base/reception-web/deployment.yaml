apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  annotations:
    # Trigger a rolling restart when reception-web-runtime-config changes (a
    # single-file subPath mount, which kubelet does NOT live-update).
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  template:
    metadata:
      # Labels handled by kustomize labels transformer
    spec:
      containers:
      - name: caddy
        image: reception-web
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
            ephemeral-storage: 100Mi
          limits:
            cpu: 200m
            memory: 128Mi
            ephemeral-storage: 100Mi
        volumeMounts:
        - name: runtime-config
          mountPath: /srv/config.json
          subPath: config.json
          readOnly: true
      volumes:
      - name: runtime-config
        configMap:
          # Provided by overlays/<env>/reception-web-configmap.yaml: the
          # reception API base URL only. The reception app has no sign-in, so
          # it carries no OIDC client id.
          name: reception-web-runtime-config
