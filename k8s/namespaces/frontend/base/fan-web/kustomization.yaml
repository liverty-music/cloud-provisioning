apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# fan-web: audience-tier successor to `web` (unify-workload-naming). Now the sole
# consumer-site frontend workload — the old `web` workload is deleted at
# delete-old and `fan-web-route` (below) owns liverty-music.app.
resources:
- deployment.yaml
- service.yaml
- httproute.yaml

configurations:
- kustomizeconfig.yaml

namePrefix: fan-web-

labels:
- includeSelectors: true
  pairs:
    app: fan-web

images:
- name: fan-web
  newName: asia-northeast2-docker.pkg.dev/liverty-music-dev/frontend/fan-web
  newTag: latest
