apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# admin-console-web: the admin console workload (unify-workload-naming),
# successor to the deleted `admin`. Owns admin.liverty-music.app via
# admin-console-web-route. Prod-only (no dev environment runs the admin console).

resources:
- deployment.yaml
- service.yaml
- httproute.yaml

configurations:
- kustomizeconfig.yaml

namePrefix: admin-console-web-

labels:
- includeSelectors: true
  pairs:
    app: admin-console-web

images:
- name: admin-console-web
  newName: asia-northeast2-docker.pkg.dev/liverty-music-dev/frontend/admin-console-web
  newTag: latest
