apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# admin-console-web: audience-tier successor to `admin` (unify-workload-naming,
# phase 3 create-new). Cloned from base/admin ADDITIVELY — the live `admin-app`
# keeps serving admin.liverty-music.app until the admin cutover repoints the route
# to admin-console-web-svc and the old workload is deleted. The HTTPRoute is
# intentionally OMITTED here so the new workload runs detached (claims no Gateway
# hostname → no route conflict); the route is added at cutover. Prod-only, like
# base/admin (there is no dev environment to run the admin console).

resources:
- deployment.yaml
- service.yaml

configurations:
- kustomizeconfig.yaml

namePrefix: admin-console-web-

labels:
- includeSelectors: true
  pairs:
    app: admin-console-web

images:
- name: admin-console-web
  newName: asia-northeast2-docker.pkg.dev/liverty-music-dev/frontend/admin-console-web
  newTag: latest
