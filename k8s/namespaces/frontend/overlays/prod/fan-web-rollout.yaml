# fan-web release gate (OpenSpec change add-prod-preview-release, D1).
#
# The Rollout takes its Pod template from the base Deployment (workloadRef), so
# a release is still a change to that Deployment's template (the image pin, the
# version label). The Deployment is set to replicas: 0 in kustomization.yaml and
# this Rollout owns the Pods.
#
# Every release is checked before it goes live: its Pods are first selected by
# the preview Service (https://preview.liverty-music.app), the pre-promotion
# analysis below smoke-tests them through that Service, and only a pass switches
# the active Service, which the fans' route targets. A failed check aborts the
# release and fans keep the current Pods. To also look at a release by hand
# before it goes live, merge autoPromotionEnabled: false before cutting it, and
# set it back afterwards (docs/runbooks/prod-image-tag-pinning.md).
#
# Argo Rollouts writes the ReplicaSet hash into the selector of the two
# Services; the frontend Application ignores that field (argocd-apps/prod/
# frontend.yaml, design D5).
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: fan-web-app
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: fan-web
  workloadRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fan-web-app
  strategy:
    blueGreen:
      activeService: fan-web-svc
      previewService: fan-web-preview-svc
      autoPromotionEnabled: true
      # The new Pods must pass the preview smoke Job below before the switch.
      prePromotionAnalysis:
        templates:
        - templateName: fan-web-preview-smoke
      previewReplicaCount: 1
      # Keep the replaced Pods for 5 minutes after a promotion, so a page that
      # was loading from them finishes and an abort right after a promotion
      # has Pods to return to.
      scaleDownDelaySeconds: 300
---
# Selected by the preview HTTPRoute only. Argo Rollouts adds the ReplicaSet hash
# to the selector; the Service starts with the Deployment's labels.
apiVersion: v1
kind: Service
metadata:
  name: fan-web-preview-svc
spec:
  type: ClusterIP
  selector:
    app: fan-web
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
---
# The preview address (design D2). It serves the release waiting for promotion,
# or the same release as the production address while nothing waits.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: fan-web-preview-route
spec:
  parentRefs:
  - name: external-gateway
    namespace: gateway
  hostnames:
  - preview.liverty-music.app
  rules:
  - backendRefs:
    - name: fan-web-preview-svc
      port: 80
---
# Checks the new fan-web Pods through the preview Service before the Rollout
# switches the active Service (prePromotionAnalysis). A failed Job aborts the
# release: fans keep the current Pods. The page must answer and /config.json
# must say this is prod; the full smoke spec (e2e/smoke/post-deploy.spec.ts)
# stays a manual check on https://preview.liverty-music.app.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: fan-web-preview-smoke
spec:
  metrics:
  - name: preview-answers
    count: 1
    provider:
      job:
        spec:
          backoffLimit: 2
          ttlSecondsAfterFinished: 600
          template:
            spec:
              restartPolicy: Never
              securityContext:
                runAsNonRoot: true
                runAsUser: 100
                seccompProfile:
                  type: RuntimeDefault
              containers:
              - name: smoke
                image: curlimages/curl:8.11.1
                command:
                - sh
                - -ec
                - |
                  base=http://fan-web-preview-svc
                  curl -fsS --max-time 10 -o /dev/null "$base/"
                  curl -fsS --max-time 10 "$base/config.json" | grep -Eq '"environment": *"prod"'
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop: [ALL]
                resources:
                  requests:
                    cpu: 10m
                    memory: 16Mi
                    ephemeral-storage: 10Mi
                  limits:
                    cpu: 100m
                    memory: 32Mi
                    ephemeral-storage: 10Mi
