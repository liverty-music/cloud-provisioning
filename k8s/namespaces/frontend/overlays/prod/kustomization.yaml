apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Prod frontend overlay. Env-divergent fields per design D2 / spec Requirement 3:
#   - HTTPRoute hostname: liverty-music.app (apex) vs dev's dev.liverty-music.app
#   - Runtime config (web-app-runtime-config ConfigMap) — prod hostnames,
#     prod OIDC client/org IDs, prod VAPID key, `info` log level.
# Resource sizing matches dev exactly; spot label matches.
resources:
  - ../../base
  # admin-console-web: the admin console workload (unify-workload-naming),
  # successor to the deleted `admin` workload. Owns admin.liverty-music.app via
  # admin-console-web-route. Prod-only (no dev environment runs the admin console).
  - ../../base/admin-console-web
  # organizer-console-web: the organizer console workload (unify-workload-naming),
  # successor to the deleted `organizer` workload. Owns organizer.liverty-music.app
  # via organizer-console-web-route. Prod-only (no dev environment runs the
  # organizer console). The Spot VM patch targets `kind: Deployment`, so it applies
  # to this Deployment automatically; the `app.kubernetes.io/version` label and the
  # `organizer-console-web` image pin below track the frontend release.
  - ../../base/organizer-console-web
  - fan-web-configmap.yaml
  - admin-console-web-configmap.yaml
  - organizer-console-web-configmap.yaml
namespace: frontend
# Apply the Kubernetes Recommended Label `app.kubernetes.io/version` to every
# rendered resource. Value SHALL be the bare semver without the leading `v`
# (per Kubernetes Recommended Labels convention: `1.0.0`, not `v1.0.0`). Bump
# this in lock-step with the `images:` block `newTag:` below — they SHALL refer
# to the same release.
#
# - `includeSelectors: false` keeps the label out of `selector.matchLabels`
#   and Service selectors; modifying selectors mid-rollout would orphan running
#   Pods. The label is metadata-only.
# - `includeTemplates: true` propagates the label to `spec.template.metadata.labels`
#   on the Deployment so Pods carry it for Prometheus / OTel scraping.
labels:
  - pairs:
      app.kubernetes.io/version: "1.56.2"
    includeSelectors: false
    includeTemplates: true
patches:
  - path: spot-vm_patch.yaml
    target:
      kind: Deployment
  # Match dev's resource sizing exactly (design D2).
  - target:
      kind: Deployment
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: fan-web-app
      spec:
        template:
          spec:
            containers:
            - name: caddy
              resources:
                requests:
                  cpu: 10m
                  memory: 52Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
  # Prod consumer-site HTTPRoute hostname (apex). fan-web-route replaces the
  # deleted web-route and owns liverty-music.app -> fan-web-svc.
  - target:
      kind: HTTPRoute
      name: fan-web-route
    patch: |-
      - op: add
        path: /spec/hostnames
        value: ["liverty-music.app"]
  # Prod admin console HTTPRoute hostname. admin-console-web-route replaces the
  # deleted admin-route and owns admin.liverty-music.app -> admin-console-web-svc.
  - target:
      kind: HTTPRoute
      name: admin-console-web-route
    patch: |-
      - op: add
        path: /spec/hostnames
        value: ["admin.liverty-music.app"]
  # Prod organizer HTTPRoute hostname. unify-workload-naming cutover: the hostname
  # now attaches to organizer-console-web-route (successor), atomically moving
  # organizer.liverty-music.app off the old organizer-route -> organizer-console-web-svc.
  - target:
      kind: HTTPRoute
      name: organizer-console-web-route
    patch: |-
      - op: add
        path: /spec/hostnames
        value: ["organizer.liverty-music.app"]
# Pin the web-app image to prod Artifact Registry with an immutable
# semantic-version tag. Per OpenSpec `enable-prod-ar-immutable-tags` +
# the `prod-image-tag-immutability` spec, prod uses semver tags (e.g.,
# v1.0.0) backed by AR's `dockerConfig.immutableTags: true` policy,
# which rejects tag-overwrite attempts at the registry API. Combined,
# this gives at-a-glance version visibility AND digest-equivalent
# immutability. The inline comment after the `newTag:` records the
# source commit SHA so incident-response trace from manifest → exact
# commit does not require an Artifact Registry round-trip.
#
# Policy: see docs/runbooks/prod-image-tag-pinning.md
#
# Note on the `name:` field: `base/web/kustomization.yaml` already has
# its own `images:` transformer that rewrites the bare container
# `image: web-app` → `asia-northeast2-docker.pkg.dev/liverty-music-dev/
# frontend/web-app:latest` (env-specific config in base is pre-existing
# tech debt; out of scope here). By the time this overlay's `images:`
# block runs, the rendered image is already the dev-AR form, so we
# match against THAT name. Kustomize's last-write-wins semantics then
# rewrites to the prod AR FQDN + semver tag.
#
# Dev overlay omits an `images:` block: ArgoCD Image Updater resolves
# the dev-AR `:latest` reference dynamically. Prod uses explicit semver
# pinning; dev AR repos stay mutable so Image Updater can rewrite tags.
#
# Bumping on release: this block is now CI-written, not hand-edited.
# Cutting a GH Release (e.g., v1.0.1) on frontend retags the dev-AR digest
# into prod AR, then emits a `repository_dispatch` to this repo's
# `.github/workflows/bump-prod-pin.yml`, which rewrites the `web-app`
# `newTag:` + its inline `# commit <sha>` trailer AND the
# `app.kubernetes.io/version` label above (in lock-step) and pushes straight
# to main. ArgoCD auto-syncs. No manual pin-bump PR. See
# docs/runbooks/prod-image-tag-pinning.md (OpenSpec change automate-prod-pin-bump).
images:
  # fan-web (unify-workload-naming): the consumer web bundle, successor to the
  # deleted web-app. Bumped by the `component:frontend` pin-bump on each frontend
  # release (routed to fan-web in bump-prod-pin.yml).
  - name: asia-northeast2-docker.pkg.dev/liverty-music-dev/frontend/fan-web
    newName: asia-northeast2-docker.pkg.dev/liverty-music-prod/frontend/fan-web
    newTag: v1.56.2 # commit f02d210c46d44594e479830f1161b96754702ef1
  # admin-console-web (unify-workload-naming): the admin console bundle, successor
  # to admin-app. Now ACTIVE — the admin-console-web-app Deployment (create-new)
  # references it. Pinned at v1.52.0 (the release that first published
  # admin-console-web to prod AR). Set directly here because the release-time
  # `frontend-admin` pin-bump was dropped by the bump-prod-pin concurrency race.
  - name: asia-northeast2-docker.pkg.dev/liverty-music-dev/frontend/admin-console-web
    newName: asia-northeast2-docker.pkg.dev/liverty-music-prod/frontend/admin-console-web
    newTag: v1.56.0 # commit a9fe1213df5ee5730ab0f6f724b91229b4c708e3
  # organizer-console-web (unify-workload-naming): successor to organizer-app. Now
  # ACTIVE — the organizer-console-web-app Deployment references it.
  # Pinned at v1.53.0 (the release that first published organizer-console-web to
  # prod AR). Bumped on each frontend release by the `component:frontend-organizer`
  # pin-bump (routed here in bump-prod-pin.yml).
  - name: asia-northeast2-docker.pkg.dev/liverty-music-dev/frontend/organizer-console-web
    newName: asia-northeast2-docker.pkg.dev/liverty-music-prod/frontend/organizer-console-web
    newTag: v1.56.1 # commit b9e1badc90688f3596a7f814cabe698bc8123238
