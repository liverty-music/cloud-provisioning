apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base
# organizer-console-web: dev sibling of fan-web in the frontend namespace
# (unify-workload-naming, successor to the deleted `organizer`). The Spot VM
# patch targets `kind: Deployment`, so it applies to the organizer-console-web
# Deployment automatically.
- ../../base/organizer-console-web
- fan-web-configmap.yaml
- organizer-console-web-configmap.yaml

namespace: frontend

patches:
# Global Spot VM patch for all Deployments in dev
- path: spot-vm_patch.yaml
  target:
    kind: Deployment

# Right-size resources for dev
- target:
    kind: Deployment
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: fan-web-app
    spec:
      template:
        spec:
          containers:
          - name: caddy
            resources:
              requests:
                cpu: 10m
                memory: 52Mi
              limits:
                cpu: 100m
                memory: 128Mi

# Right-size the organizer console for dev (match the consumer web sizing).
- target:
    kind: Deployment
    name: organizer-console-web-app
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: organizer-console-web-app
    spec:
      template:
        spec:
          containers:
          - name: caddy
            resources:
              requests:
                cpu: 10m
                memory: 52Mi
              limits:
                cpu: 100m
                memory: 128Mi

# Dev consumer-site HTTPRoute hostname. fan-web-route replaces the deleted
# web-route and owns dev.liverty-music.app (dev is intentionally stopped).
- target:
    kind: HTTPRoute
    name: fan-web-route
  patch: |-
    - op: add
      path: /spec/hostnames
      value: ["dev.liverty-music.app"]

# Dev organizer HTTPRoute hostname.
- target:
    kind: HTTPRoute
    name: organizer-console-web-route
  patch: |-
    - op: add
      path: /spec/hostnames
      value: ["organizer.dev.liverty-music.app"]
