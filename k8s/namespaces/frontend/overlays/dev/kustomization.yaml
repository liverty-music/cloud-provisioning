apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base
# Organizer console workload — dev sibling of web/ in the frontend namespace.
# The Spot VM patch targets `kind: Deployment`, so it applies to the organizer
# Deployment automatically. See OpenSpec change `organizer-console`.
- ../../base/organizer
- configmap.yaml
- fan-web-configmap.yaml
- organizer-configmap.yaml

namespace: frontend

patches:
# Global Spot VM patch for all Deployments in dev
- path: spot-vm_patch.yaml
  target:
    kind: Deployment

# Right-size resources for dev
- target:
    kind: Deployment
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: web-app
    spec:
      template:
        spec:
          containers:
          - name: caddy
            resources:
              requests:
                cpu: 10m
                memory: 52Mi
              limits:
                cpu: 100m
                memory: 128Mi

# Right-size the organizer console for dev (match the consumer web sizing).
- target:
    kind: Deployment
    name: organizer-app
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: organizer-app
    spec:
      template:
        spec:
          containers:
          - name: caddy
            resources:
              requests:
                cpu: 10m
                memory: 52Mi
              limits:
                cpu: 100m
                memory: 128Mi

# Patch HTTPRoute hostname for dev environment
# unify-workload-naming fan cutover: repoint dev.liverty-music.app to fan-web-svc
# (kept coherent with prod; dev is intentionally stopped so this is inert).
- target:
    kind: HTTPRoute
    name: web-route
  patch: |-
    - op: add
      path: /spec/hostnames
      value: ["dev.liverty-music.app"]
    - op: replace
      path: /spec/rules/0/backendRefs/0/name
      value: fan-web-svc

# Dev organizer HTTPRoute hostname.
- target:
    kind: HTTPRoute
    name: organizer-route
  patch: |-
    - op: add
      path: /spec/hostnames
      value: ["organizer.dev.liverty-music.app"]
