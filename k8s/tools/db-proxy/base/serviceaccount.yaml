# Bound (Workload Identity) to the connect-only `db-proxy` GSA, which holds
# `roles/cloudsql.client` only and no Cloud SQL user. The overlays set the GSA
# email.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: db-proxy
  labels:
    app.kubernetes.io/name: db-proxy
  annotations:
    iam.gke.io/gcp-service-account: GSA_EMAIL # set by overlay
