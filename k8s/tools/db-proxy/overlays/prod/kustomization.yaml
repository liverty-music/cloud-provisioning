apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base

patches:
- target:
    kind: ServiceAccount
    name: db-proxy
  patch: |-
    - op: replace
      path: /metadata/annotations/iam.gke.io~1gcp-service-account
      value: db-proxy@liverty-music-prod.iam.gserviceaccount.com
- target:
    kind: Pod
    name: db-proxy
  patch: |-
    - op: replace
      path: /spec/containers/0/args/3
      value: liverty-music-prod:asia-northeast2:postgres-osaka
