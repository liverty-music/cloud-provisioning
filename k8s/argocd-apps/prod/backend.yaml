apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backend
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  ignoreDifferences:
  # event-consumer (unify-workload-naming, was consumer-app): KEDA drives
  # /spec/replicas, so ArgoCD must ignore replica drift or it flaps OutOfSync.
  - group: apps
    kind: Deployment
    name: event-consumer
    jsonPointers:
    - /spec/replicas
  # fan-api runs under an Argo Rollouts blueGreen Rollout (OpenSpec change
  # add-prod-preview-release, D1, D5): the controller writes the ReplicaSet hash
  # into the selector of the active and the preview Service. fan-api-webhook-svc
  # is not managed by the Rollout and keeps its selector in git.
  - kind: Service
    name: fan-api-svc
    jsonPointers:
    - /spec/selector
  - kind: Service
    name: fan-api-preview-svc
    jsonPointers:
    - /spec/selector
  source:
    repoURL: https://github.com/liverty-music/cloud-provisioning.git
    targetRevision: main
    path: k8s/namespaces/backend/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: backend
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    # Server-Side Apply, matching the cluster-wide Server-Side Diff
    # (`controller.diff.server.side`). With client-side apply, fields the
    # controller wrote via `Update` are never predicted as removed, so a
    # Git change that only deletes a field stays "Synced" and never applies
    # (argoproj/argo-cd#23845).
    - ServerSideApply=true
    - RespectIgnoreDifferences=true
