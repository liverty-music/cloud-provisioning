apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backend
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  ignoreDifferences:
  # event-consumer (unify-workload-naming, was consumer-app): KEDA drives
  # /spec/replicas, so ArgoCD must ignore replica drift or it flaps OutOfSync.
  - group: apps
    kind: Deployment
    name: event-consumer
    jsonPointers:
    - /spec/replicas
  source:
    repoURL: https://github.com/liverty-music/cloud-provisioning.git
    targetRevision: main
    path: k8s/namespaces/backend/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: backend
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
