apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  # fan-web runs under an Argo Rollouts blueGreen Rollout (OpenSpec change
  # add-prod-preview-release, D1). The controller writes the ReplicaSet hash into
  # the selector of the active and the preview Service; without this ignore,
  # selfHeal reverts the selector and the active Service would select the
  # waiting release too (design D5). RespectIgnoreDifferences makes the sync
  # skip the ignored field as well as the diff.
  ignoreDifferences:
  - kind: Service
    name: fan-web-svc
    jsonPointers:
    - /spec/selector
  - kind: Service
    name: fan-web-preview-svc
    jsonPointers:
    - /spec/selector
  source:
    repoURL: https://github.com/liverty-music/cloud-provisioning.git
    targetRevision: main
    path: k8s/namespaces/frontend/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: frontend
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    # Server-Side Apply, matching the cluster-wide Server-Side Diff
    # (`controller.diff.server.side`). With client-side apply, fields the
    # controller wrote via `Update` are never predicted as removed, so a
    # Git change that only deletes a field stays "Synced" and never applies
    # (argoproj/argo-cd#23845).
    - ServerSideApply=true
    - RespectIgnoreDifferences=true
