apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-collector
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/liverty-music/cloud-provisioning.git
    targetRevision: main
    path: k8s/namespaces/otel-collector/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: otel-collector
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    # Server-Side Apply, matching the cluster-wide Server-Side Diff
    # (`controller.diff.server.side`). With client-side apply, fields the
    # controller wrote via `Update` are never predicted as removed, so a
    # Git change that only deletes a field stays "Synced" and never applies
    # (argoproj/argo-cd#23845).
    - ServerSideApply=true
